<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave 快速开始 · 交互设计预览</title>
<style>
/* Local study only: no network, fonts, scripts or assets are loaded from outside this file.
   Colors are the app's Minimal Light / Minimal Dark Material schemes (Theme.kt); sizes are the
   WeaveUiTokens values, with 1dp drawn as 1px. */
:root{
  --chrome-bg:#e9e6e0;--chrome-ink:#26231f;--chrome-muted:#6b655c;--chrome-line:#c9c3b8;--chrome-card:#f6f3ee;
}
.viewport[data-theme=light]{
  --bg:#F4F6F8;--surface:#FBFCFD;--surface-variant:#E9EDF1;
  --primary:#2F4858;--on-primary:#FFFFFF;
  --secondary:#4C6A61;--on-secondary:#FFFFFF;--secondary-container:#DCEAE4;--on-secondary-container:#1C3831;
  --tertiary:#8B5B4E;
  --on-bg:#1D252D;--muted:#56616E;--outline:#6F7D89;--outline-variant:#D1D8DE;
  --shadow:0 1.5px 3px rgba(29,37,45,.08);
}
.viewport[data-theme=dark]{
  --bg:#0B0E13;--surface:#171C23;--surface-variant:#232A34;
  --primary:#C5DCEB;--on-primary:#0B0E13;
  --secondary:#8CCCB3;--on-secondary:#0B0E13;--secondary-container:#233832;--on-secondary-container:#F1F3F6;
  --tertiary:#DFAFA6;
  --on-bg:#F1F3F6;--muted:#ADB6C2;--outline:#626D7B;--outline-variant:#333C48;
  --shadow:0 1.5px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--chrome-bg);color:var(--chrome-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  line-height:1.5;padding:20px 16px 48px}
.wrap{max-width:1040px;margin:0 auto}

/* ---------- preview chrome (not part of the design) ---------- */
.banner{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;border:1px dashed var(--chrome-line);
  background:var(--chrome-card);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.banner b{font-size:16px}
.banner span{font-size:13px;color:var(--chrome-muted)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.ctl{background:var(--chrome-card);border:1px solid var(--chrome-line);border-radius:14px;padding:10px 12px}
.ctl h2{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--chrome-muted);letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.act{font:inherit;font-size:13px;min-height:36px;padding:6px 12px;border-radius:10px;cursor:pointer;
  border:1px solid var(--chrome-line);background:#fff;color:var(--chrome-ink)}
.seg button[aria-pressed=true]{background:var(--chrome-ink);border-color:var(--chrome-ink);color:#fff}
.act:hover,.seg button:hover{border-color:var(--chrome-ink)}
.status{font-size:13px;color:var(--chrome-muted);margin:0 0 12px;min-height:20px}
.status code{background:#fff;border:1px solid var(--chrome-line);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--chrome-ink)}
.stage{display:flex;justify-content:center;align-items:flex-start;overflow-x:auto;padding:4px 0 12px}

/* ---------- the design ---------- */
.viewport{position:relative;height:680px;flex:none;overflow:hidden;border-radius:30px;
  border:6px solid #2b2a28;background:var(--bg);color:var(--on-bg);--fs:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.viewport button{font-family:inherit}
.viewport.w320{width:332px}.viewport.w360{width:372px}.viewport.wtab{width:860px;height:640px}
.scrim{position:absolute;inset:0;display:none;background:rgba(0,0,0,.4)}
.wtab .scrim{display:block}
.card{position:absolute;inset:0;background:var(--bg);overflow:hidden;
  background-image:radial-gradient(120% 60% at 90% -10%,color-mix(in srgb,var(--secondary) 10%,transparent),transparent 60%),
                   radial-gradient(90% 50% at -10% 110%,color-mix(in srgb,var(--tertiary) 8%,transparent),transparent 60%)}
.wtab .card{inset:24px auto 24px 50%;width:560px;transform:translateX(-50%);border-radius:30px;border:.5px solid var(--outline-variant)}
.guide{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.guide[hidden]{display:none}

.topbar{display:flex;align-items:center;min-height:48px;padding:4px 8px}
.topbar .sp{flex:1}
.iconbtn{width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--on-bg);display:grid;place-items:center;cursor:pointer}
.textbtn{min-height:48px;min-width:48px;padding:0 12px;border:0;border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;
  font-size:calc(15px*var(--fs));line-height:calc(21px*var(--fs));font-weight:600}
.iconbtn:hover,.textbtn:hover{background:color-mix(in srgb,var(--on-bg) 8%,transparent)}
.viewport :focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.host{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.page-in{min-height:100%;display:flex;flex-direction:column;padding:0 20px}
.spacer{flex:1}
.host.busy{pointer-events:none}
.page.enter-fwd{animation:in-fwd .22s cubic-bezier(.4,0,.2,1) both}
.page.enter-back{animation:in-back .22s cubic-bezier(.4,0,.2,1) both}
.page.leave-fwd{animation:out-fwd .22s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
.page.leave-back{animation:out-back .22s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes in-fwd{from{opacity:0;transform:translateX(10%)}to{opacity:1;transform:none}}
@keyframes in-back{from{opacity:0;transform:translateX(-10%)}to{opacity:1;transform:none}}
@keyframes out-fwd{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-10%)}}
@keyframes out-back{from{opacity:1;transform:none}to{opacity:0;transform:translateX(10%)}}

/* progress path */
.path{display:flex}
.path .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.path .lbl{font-size:calc(12px*var(--fs));line-height:calc(18px*var(--fs));font-weight:600;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.path .lbl.cur{color:var(--on-bg)}
.pm{position:relative;height:24px;width:100%}
.pm .ln{position:absolute;top:11px;height:2px;background:var(--outline-variant)}
.pm .ln.l{left:0;right:50%}.pm .ln.r{left:50%;right:0}
.pm .ln.on{background:var(--secondary)}
.pm .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.dot.done{width:18px;height:18px;background:var(--secondary);display:grid;place-items:center}
.dot.cur{width:12px;height:12px;background:var(--primary);box-shadow:0 0 0 6px color-mix(in srgb,var(--primary) 18%,transparent)}
.dot.todo{width:12px;height:12px;background:var(--bg);border:1.5px solid var(--outline)}

/* panels */
.vig{margin-top:16px;border-radius:26px;background:var(--surface);border:.5px solid var(--outline-variant);box-shadow:var(--shadow);padding:0 16px}
.vig svg{display:block;width:100%;height:88px}
.eyebrow{margin:24px 0 6px;font-size:calc(12px*var(--fs));line-height:calc(18px*var(--fs));font-weight:600;letter-spacing:1px;
  color:var(--secondary);font-variant-numeric:tabular-nums}
h1{margin:0 0 10px;font-size:calc(29px*var(--fs));line-height:calc(35px*var(--fs));font-weight:600;letter-spacing:-.45px;overflow-wrap:anywhere}
.desc{margin:0 0 20px;font-size:calc(15px*var(--fs));line-height:calc(23px*var(--fs));color:var(--muted)}
.label{margin:0 0 8px 4px;font-size:calc(12px*var(--fs));line-height:calc(18px*var(--fs));font-weight:600;color:var(--muted)}
.panel{border-radius:19px;background:var(--surface);border:.5px solid var(--outline-variant);box-shadow:var(--shadow)}
.row{display:flex;gap:14px;align-items:flex-start;min-height:56px;padding:12px 16px}
.row+.row{border-top:.5px solid var(--outline-variant);margin:0 0;}
.row .tile{flex:none;width:36px;height:36px;border-radius:11px;background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:calc(15px*var(--fs));line-height:calc(21px*var(--fs));font-weight:600;overflow-wrap:anywhere}
.row .b{font-size:calc(14px*var(--fs));line-height:calc(21px*var(--fs));color:var(--muted)}
.gap{height:16px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:19px}
.notice .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.notice .t{font-size:calc(15px*var(--fs));line-height:calc(21px*var(--fs));font-weight:600}
.notice .b{font-size:calc(14px*var(--fs));line-height:calc(21px*var(--fs))}
.notice.pos{background:var(--secondary-container);color:var(--on-secondary-container)}
.notice.neu{background:var(--surface-variant);color:var(--muted)}
.notice.gen{background:color-mix(in srgb,var(--tertiary) 14%,transparent);color:var(--on-bg)}
.notice.gen svg{color:var(--tertiary)}
.notice svg,.row svg{flex:none}
.notice>svg{margin-top:0}

/* footer */
.footer{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.btn{width:100%;min-height:52px;padding:12px 20px;border-radius:16px;border:0;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;
  text-align:center;font-size:calc(15px*var(--fs));line-height:calc(21px*var(--fs));font-weight:600;
  background:var(--primary);color:var(--on-primary);transition:transform .14s cubic-bezier(.4,0,.2,1)}
.btn.out{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{cursor:default;background:color-mix(in srgb,var(--on-bg) 12%,transparent);color:color-mix(in srgb,var(--on-bg) 38%,transparent)}
.link{width:100%;min-height:48px;padding:8px 16px;border:0;border-radius:24px;background:transparent;color:var(--primary);cursor:pointer;
  text-align:center;font-size:calc(15px*var(--fs));line-height:calc(23px*var(--fs));font-weight:600}
.link:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.motion{display:flex;align-items:center;gap:12px;min-height:48px;margin-top:6px;padding:4px;border-radius:11px;cursor:pointer;
  background:none;border:0;width:100%;text-align:left;color:var(--muted);font-size:calc(14px*var(--fs));line-height:calc(21px*var(--fs))}
.motion .tx{flex:1;min-width:0}
.motion:hover{background:color-mix(in srgb,var(--on-bg) 6%,transparent)}
.sw{position:relative;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-variant);transition:background .2s,border-color .2s}
.sw i{position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--outline);transition:left .2s,width .2s,height .2s,margin-top .2s,background .2s}
.sw.on{background:var(--primary);border-color:var(--primary)}
.sw.on i{left:24px;width:24px;height:24px;margin-top:-12px;background:var(--on-primary)}
.bottom{height:22px;flex:none}

/* reduced motion: every authored animation and press scaling is off */
.reduced .page,.reduced .btn,.reduced .sw,.reduced .sw i{animation:none!important;transition:none!important}
.reduced .btn:active:not(:disabled){transform:none}

/* mock child dialogs and closed state (preview only) */
.child,.closed{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 92%,#000)}
.child[hidden],.closed[hidden]{display:none}
.mock{width:100%;max-width:340px;border:1.5px dashed var(--outline);border-radius:22px;background:var(--surface);padding:18px;box-shadow:var(--shadow)}
.mock .tag{font-size:calc(11px*var(--fs));color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.mock h3{margin:0 0 8px;font-size:calc(18px*var(--fs));line-height:calc(24px*var(--fs))}
.mock p{margin:0 0 14px;font-size:calc(14px*var(--fs));line-height:calc(21px*var(--fs));color:var(--muted)}
.mock .err{color:var(--on-bg);background:color-mix(in srgb,var(--tertiary) 14%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:calc(14px*var(--fs));line-height:calc(21px*var(--fs))}
.mock .actions{display:flex;flex-direction:column;gap:8px}
.mock .btn{min-height:48px}
.closed .mock{text-align:center}
.import-strip{display:flex;gap:8px;padding:12px}.import-strip>div{flex:1;min-width:0;text-align:center;display:flex;align-items:center;flex-direction:column;gap:6px}.import-strip svg{width:32px;height:32px;padding:6px;border-radius:10px;background:var(--secondary-container);color:var(--on-secondary-container)}.import-strip span{font-size:calc(14px*var(--fs));line-height:1.4;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <b>交互设计预览 · 非实机截图</b>
    <span id="bannerSub">Interaction design preview · not a device screenshot. Every action only changes local mock state; nothing is requested, saved or sent.</span>
  </header>

  <section class="controls" id="controls" aria-label="preview controls"></section>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="stage">
    <div class="viewport w360" id="viewport" data-theme="light">
      <div class="scrim" id="scrim"></div>
      <div class="card" id="card" data-testtag="quick-start">
        <div class="guide" id="guide" role="dialog" aria-modal="true">
          <div class="topbar" id="topbar"></div>
          <div class="host" id="host"></div>
        </div>
      </div>
      <div class="child" id="child" hidden></div>
      <div class="closed" id="closed" hidden></div>
    </div>
  </div>
</div>

  var S = {
    step: 0, hasNodes: false, hasProxy: false, connected: false, connecting: false, error: false,
    reduced: false, theme: 'light', lang: 'zh', big: 1, width: '360',
    child: null, childErr: false, dismissed: false, outcome: 'once', failedOnce: false, vpnOk: false,
    log: ''

  var timer = null;
  var uid = 0;

        '<g fill="currentColor" stroke="none"><rect x="3.6" y="3.6" width="2.3" height="2.3"/><rect x="14.1" y="3.6" width="2.3" height="2.3"/><rect x="3.6" y="14.1" width="2.3" height="2.3"/>' +
        '<rect x="12.5" y="12.5" width="2.5" height="2.5"/><rect x="16" y="16" width="2.5" height="2.5"/></g>',
    file: '<path d="M4.5 2H11L16 7V17.5H4.5Z"/><path d="M11 2V7H16"/><path d="M7.5 11.5H13M7.5 14.5H11"/>'
  };
  function glyph(name) {
    return '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + G[name] + '</svg>';
  }

  /* ---------- building blocks (mirror the Compose composables) ---------- */
  function tag(name) { return 'data-testtag="' + name + '"'; }

  function pathHTML(cur) {
    var labels = ['导入', '节点', '连接'];
    var desc = t('快速开始进度：第 ' + (cur + 1) + ' 步，共 3 步');
    var cols = labels.map(function (l, i) {
      var dot = i < cur
        ? '<span class="dot done"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--on-secondary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 6.2 5 8.8 9.6 3.6"/></svg></span>'
        : i === cur ? '<span class="dot cur"></span>' : '<span class="dot todo"></span>';
      var left = i > 0 ? '<span class="ln l' + (i <= cur ? ' on' : '') + '"></span>' : '';
      var right = i < 2 ? '<span class="ln r' + (i < cur ? ' on' : '') + '"></span>' : '';
      return '<div class="col"><div class="pm">' + left + right + dot + '</div><div class="lbl' + (i === cur ? ' cur' : '') + '">' + t(l) + '</div></div>';
    }).join('');
    return '<div class="path" role="img" aria-label="' + desc + '">' + cols + '</div>';
  }

  function vignetteHTML() { return '<div class="vig"><svg data-thread></svg></div>'; }

  function drawThread(svg, step, complete) {
    var w = svg.clientWidth || 300, H = 88, mid = 44;
    var start = w * 0.02, half = w * 0.16, end = start + half * 6, amp = H * 0.27;
    var id = 'c' + (++uid);
    function d(sign) {
      var out = '';
      for (var i = 0; i <= 120; i++) {
        var x = start + (end - start) * i / 120;
        var y = mid + sign * amp * Math.sin(Math.PI * (x - start) / half);
        out += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
      }
      return out;
    }
    var up = d(1), lo = d(-1);
    var knots = [w * 0.18, w * 0.5, w * 0.82];
    var reach = complete ? end : knots[Math.max(0, Math.min(2, step))];
    var thread = 'fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
    var html = '<defs><clipPath id="' + id + '"><rect x="0" y="0" width="' + reach.toFixed(2) + '" height="' + H + '"/></clipPath>' +
      '<radialGradient id="g' + id + '"><stop offset="0" style="stop-color:var(--tertiary);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--tertiary);stop-opacity:0"/></radialGradient></defs>' +
      '<path d="' + up + '" ' + thread + ' style="stroke:var(--outline-variant)"/>' +
      '<path d="' + lo + '" ' + thread + ' style="stroke:var(--outline-variant)"/>' +
      '<g clip-path="url(#' + id + ')"><path d="' + lo + '" ' + thread + ' style="stroke:var(--secondary)"/><path d="' + up + '" ' + thread + ' style="stroke:var(--primary)"/></g>';
    knots.forEach(function (x, i) {
      var finished = complete || i < step, current = !finished && i === step;
      if (current) html += '<circle cx="' + x + '" cy="' + mid + '" r="36" fill="url(#g' + id + ')"/>';
      html += '<circle cx="' + x + '" cy="' + mid + '" r="13" style="fill:var(--surface)"/>';
      if (finished) {
        var r = 9;
        html += '<circle cx="' + x + '" cy="' + mid + '" r="9" style="fill:var(--secondary)"/>' +
          '<path d="M' + (x - r * .42) + ' ' + (mid + r * .02) + 'L' + (x - r * .12) + ' ' + (mid + r * .34) + 'L' + (x + r * .46) + ' ' + (mid - r * .3) +
          '" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--on-secondary)"/>';
      } else if (current) {
        html += '<circle cx="' + x + '" cy="' + mid + '" r="9" style="fill:var(--primary)"/><circle cx="' + x + '" cy="' + mid + '" r="3" style="fill:var(--on-primary)"/>';
      } else {
        html += '<circle cx="' + x + '" cy="' + mid + '" r="8" fill="none" stroke-width="1.5" style="stroke:var(--outline)"/>';
      }
    });
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + H);
    svg.innerHTML = html;
  }

  function heading(step, title, desc) {
    return '<div class="eyebrow">0' + (step + 1) + ' / 03</div><h1>' + t(title) + '</h1><p class="desc">' + t(desc) + '</p>';
  }
  function row(icon, title, body) {
    return '<div class="row"><div class="tile">' + icon + '</div><div class="tx"><div class="t">' + t(title) + '</div><div class="b">' + t(body) + '</div></div></div>';
  }
  function notice(tone, icon, title, detail, live) {
    return '<div class="notice ' + tone + '"' + (live ? ' aria-live="polite"' : '') + '>' + svgIcon(icon, 20) +
      '<div class="tx"><div class="t">' + t(title) + '</div>' + (detail ? '<div class="b">' + t(detail) + '</div>' : '') + '</div></div>';
  }
  function btn(label, act, tagName, opts) {
    opts = opts || {};
    var spin = opts.busy && !S.reduced ? '<span class="spin"></span>' : '';
    return '<button class="btn' + (opts.out ? ' out' : '') + '" data-act="' + act + '" ' + tag(tagName) + (opts.disabled ? ' disabled' : '') + '>' + spin + '<span>' + t(label) + '</span></button>';
  }

  function bodyHTML(step) {
    var h = '';
    if (step === 0) {
      h += heading(0, S.hasNodes ? '订阅已准备好' : '导入你的订阅',
        S.hasNodes ? '已有可用节点，可以继续。' : '订阅由你提供，支持链接、二维码或文件。');
      if (S.hasNodes) h += notice('pos', I.check, '已有可用节点') + '<div class="gap"></div>';
      h += '<div class="panel import-strip">'+[['link','链接'],['qr','二维码'],['file','文件']].map(function(x){return '<div>'+glyph(x[0])+'<span>'+t(x[1])+'</span></div>';}).join('')+'</div>';
    } else if (step === 1) {
      h += heading(1, '选择一个节点', '选一条代理线路，之后随时可以更换。');
      h += S.hasProxy ? notice('pos', I.check, '已选好节点', '', true) : notice('neu', I.info, '还没有选择节点', '', true);
      h += '<div class="gap"></div><div class="panel">'+row(svgIcon(I.refresh,20),'不确定选哪个？','也可以使用自动选择。')+'</div>';
    } else {
      h += heading(2, S.connected ? '一切就绪' : '准备连接',
        S.connected ? '已连接，现在可以开始使用。需要时可以随时断开。' : '点击连接时，按需确认系统 VPN 授权。');
      if (S.connected) h += notice('pos', I.check, '已连接', '', true) + '<div class="gap"></div>';
      else if (S.connecting) h += notice('neu', I.info, '正在连接…', '', true) + '<div class="gap"></div>';
      else if (S.error) h += notice('gen', I.warn, '这次没有连上', '可以重试、返回更换节点，或稍后再连接。', true) + '<div class="gap"></div>';
      h += notice('neu',I.lock,'权限在使用时确认','VPN 用于连接；相机仅扫码；通知可稍后设置。');
    }
    return h;
  }

  function footerHTML(step) {
    var f = '';
    if (step === 0) {
      if (S.hasNodes) {
        f += btn('下一步', 'next', 'quick-start-primary') +
          '<button class="link" data-act="primary" ' + tag('quick-start-secondary') + '>' + t('导入其他订阅') + '</button>';
      } else f += btn('导入订阅', 'primary', 'quick-start-primary');
    } else if (step === 1) {
      if (S.hasProxy) f += btn('下一步', 'next', 'quick-start-next') + btn('选择节点', 'primary', 'quick-start-primary', { out: true });
      else f += btn('选择节点', 'primary', 'quick-start-primary');
    } else {
      if (S.connected) f += btn('开始使用', 'dismiss', 'quick-start-primary');
      else if (S.connecting) f += btn('正在连接…', 'noop', 'quick-start-primary', { disabled: true, busy: true });
      else f += btn('连接', 'primary', 'quick-start-primary');
    }
    return '<div class="footer">' + f + '</div>' +
      '<button class="motion" role="switch" aria-checked="' + S.reduced + '" data-act="motion" ' + tag('quick-start-motion') + '>' +
      '<span class="tx">' + t('减少动效') + '</span><span class="sw' + (S.reduced ? ' on' : '') + '"><i></i></span></button>';
  }

  function pageHTML(step) {
    return '<div class="page-in">' + pathHTML(step) + vignetteHTML() + bodyHTML(step) + '<div class="spacer"></div>' + footerHTML(step) + '<div class="bottom"></div></div>';
  }

  /* ---------- render ---------- */
  function renderGuide() {
    var host = $('host');
    var back = S.step > 0
      ? '<button class="iconbtn" data-act="back" ' + tag('quick-start-back') + ' aria-label="' + t('返回') + '">' + svgIcon(I.back, 24) + '</button>' : '';
    $('topbar').innerHTML = back + '<span class="sp"></span><button class="textbtn" data-act="skip" ' + tag('quick-start-skip') + '>' + t('跳过') + '</button>';

    var changed = lastRendered !== null && lastRendered !== S.step;
    var forward = S.step >= lastStep;
    var old = host.querySelector('.page:not(.leaving)');
    var page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = pageHTML(S.step);

    if (changed && !S.reduced && old) {
      old.classList.add('leaving', forward ? 'leave-fwd' : 'leave-back');
      page.classList.add(forward ? 'enter-fwd' : 'enter-back');
      host.classList.add('busy');
      host.appendChild(page);
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); host.classList.remove('busy'); }, 230);
    } else {
      host.innerHTML = '';
      host.appendChild(page);
    }
    lastRendered = S.step;
    lastStep = S.step;
    var svg = page.querySelector('[data-thread]');
    if (svg) drawThread(svg, S.step, S.step === 2 && S.connected);
  }

  function seg(label, key, options) {
    var btns = options.map(function (o) {
      return '<button data-set="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (String(S[key]) === String(o[0])) + '">' + o[1] + '</button>';
    }).join('');
    return '<div class="ctl"><h2>' + label + '</h2><div class="seg">' + btns + '</div></div>';
  }
  function toggles() {
    function tg(key, label) { return '<button data-flip="' + key + '" aria-pressed="' + S[key] + '">' + label + '</button>'; }
    return '<div class="ctl"><h2>' + p('已有节点') + ' / ' + p('已选节点') + ' / ' + p('动效') + '</h2><div class="seg">' +
      tg('hasNodes', p('已有节点')) + tg('hasProxy', p('已选节点')) + tg('reduced', p('减少动效')) + '</div></div>';
  }
  function renderControls() {
    $('controls').innerHTML =
      seg(p('主题'), 'theme', [['light', p('浅色')], ['dark', p('深色')]]) +
      seg(p('语言'), 'lang', [['zh', '简体'], ['zhHant', '繁體'], ['en', 'English'], ['ja', '日本語'], ['fr', 'Français'], ['de', 'Deutsch']]) +
      seg(p('字号'), 'big', [['1', '100%'], ['2', '200%']]) +
      seg(p('宽度'), 'width', [['320', '320dp'], ['360', '360dp'], ['tab', p('平板')]]) +
      seg(p('连接结果（模拟）'), 'outcome', [['once', p('先失败再成功')], ['ok', p('总是成功')], ['fail', p('总是失败')]]) +
      toggles() +
      '<div class="ctl"><h2>' + p('操作') + '</h2><div class="seg"><button class="act" data-do="sysback">' + p('系统返回键') + '</button>' +
      '<button class="act" data-do="reopen">' + p('从设置打开引导') + '</button><button class="act" data-do="reset">' + p('重置') + '</button></div></div>';
    $('bannerSub').textContent = S.lang !== 'zh'
      ? 'Interaction design preview · not a device screenshot. Every action only changes local mock state; nothing is requested, saved or sent.'
      : 'Interaction design preview · not a device screenshot。所有操作只改变本页的模拟状态，不会请求权限、联网或保存任何内容。';
    $('status').innerHTML = p('最近操作：') + '<code>' + (S.log || p('暂无操作')) + '</code>';
  }

  function mockChild() {
    var c = $('child'), h = '';
    if (!S.child) { c.hidden = true; c.innerHTML = ''; return; }
    var head = '<div class="mock"><div class="tag">' + p('模拟窗口 · 非引导界面') + '</div>';
    if (S.child === 'import') {
      h = head + '<h3>' + p('导入订阅（模拟）') + '</h3>';
      if (S.childErr) h += '<div class="err" role="alert"><b>' + p('导入失败') + '</b><br>' + p('没有读取到可用节点。可以再试一次，或取消回到引导。') + '</div>' +
        '<div class="actions"><button class="btn" data-child="import-ok">' + p('再试一次（模拟成功）') + '</button><button class="btn out" data-child="cancel">' + p('取消') + '</button></div></div>';
      else h += '<p>' + p('这里是应用自己的导入窗口，引导已被隐藏。') + '</p>' +
        '<div class="actions"><button class="btn" data-child="import-ok">' + p('模拟导入成功') + '</button><button class="btn out" data-child="import-fail">' + p('模拟导入失败') + '</button><button class="btn out" data-child="cancel">' + p('取消') + '</button></div></div>';
    } else if (S.child === 'node') {
      h = head + '<h3>' + p('选择节点（模拟）') + '</h3><p>' + p('这里是应用自己的节点列表，引导已被隐藏。') + '</p>' +
        '<div class="actions"><button class="btn" data-child="node-ok">' + p('模拟选定一个节点') + '</button><button class="btn out" data-child="cancel">' + p('取消') + '</button></div></div>';
    } else {
      h = head + '<h3>' + p('应用说明（模拟）') + '</h3><p>' + p('连接时，Weave 会先在这里说明用途，然后由系统询问是否允许 VPN。') + '</p>' +
        '<div class="actions"><button class="btn" data-child="vpn-ok">' + p('继续（模拟授权）') + '</button><button class="btn out" data-child="cancel">' + p('取消') + '</button></div></div>';
    }
    c.innerHTML = h; c.hidden = false;
  }
  function mockClosed() {
    var c = $('closed');
    if (!S.dismissed) { c.hidden = true; c.innerHTML = ''; return; }
    c.innerHTML = '<div class="mock"><div class="tag">' + p('模拟窗口 · 非引导界面') + '</div><h3>' + p('引导已关闭') + '</h3><p>' + p('真实应用中会回到主界面，之后可在设置里再次打开。') +
      '</p><div class="actions"><button class="btn" data-do="reopen">' + p('从设置打开引导') + '</button></div></div>';
    c.hidden = false;
  }

  function render() {
    var vp = $('viewport');
    vp.setAttribute('data-theme', S.theme);
    vp.style.setProperty('--fs', S.big);
    vp.className = 'viewport ' + (S.width === 'tab' ? 'wtab' : 'w' + S.width) + (S.reduced ? ' reduced' : '');
    document.documentElement.lang = S.lang === 'en' ? 'en' : 'zh-CN';
    $('guide').hidden = !!S.child || S.dismissed;
    renderGuide();
    mockChild();
    mockClosed();
    renderControls();
  }

  /* ---------- simulated state transitions (no network, no permissions) ---------- */
  function say(zh, en) { S.log = S.lang === 'en' ? en : zh; }

  function startConnect() {
    clearTimeout(timer);
    S.connecting = true; S.error = false; S.connected = false;
    timer = setTimeout(function () {
      var fail = S.outcome === 'fail' || (S.outcome === 'once' && !S.failedOnce);
      if (S.outcome === 'once') S.failedOnce = true;
      S.connecting = false;
      if (fail) { S.error = true; say('模拟连接失败，显示温和的重试说明', 'mock connection failed; gentle retry note shown'); }
      else { S.connected = true; say('模拟连接成功', 'mock connection succeeded'); }
      render();
    }, 1400);
  }

  function reset() {
    clearTimeout(timer);
    var keep = { theme: S.theme, lang: S.lang, big: S.big, width: S.width, outcome: S.outcome, reduced: S.reduced };
    S = { step: 0, hasNodes: false, hasProxy: false, connected: false, connecting: false, error: false, child: null, childErr: false,
      dismissed: false, failedOnce: false, vpnOk: false, log: '' };
    for (var k in keep) S[k] = keep[k];
    lastRendered = null; lastStep = 0;
  }

  function act(name) {
    if (name === 'primary') {
      if (S.step === 0) { S.child = 'import'; S.childErr = false; say('点击导入入口，打开导入窗口', 'opened the import dialog'); }
      else if (S.step === 1) { S.child = 'node'; say('点击“选择节点”，打开节点列表', 'opened the node list'); }
      else if (!S.vpnOk) { S.child = 'vpn'; say('点击“连接”，先显示应用说明', 'tapped Connect; app disclosure shown first'); }
      else { say('点击“连接”（重试）', 'tapped Connect (retry)'); startConnect(); }
    } else if (name === 'next') {
      S.step = Math.min(2, S.step + 1); say('点击“下一步”', 'tapped Next');
    } else if (name === 'back') {
      S.step = Math.max(0, S.step - 1); say('返回上一步', 'went back one step');
    } else if (name === 'skip' || name === 'dismiss') {
      S.dismissed = true; say(name === 'skip' ? '跳过，关闭引导（未请求任何权限）' : '点击“开始使用”，关闭引导', name === 'skip' ? 'skipped; guide closed (no permission requested)' : 'tapped Get started; guide closed');
    } else if (name === 'motion') {
      S.reduced = !S.reduced; say(S.reduced ? '开启减少动效' : '关闭减少动效', S.reduced ? 'reduced motion on' : 'reduced motion off');
    }
    render();
  }

  function childAct(name) {
    var wasStep = S.step;
    if (name === 'cancel') {
      S.child = null; S.childErr = false; say('取消子窗口，回到引导，状态不变', 'cancelled; back in the guide, nothing changed');
    } else if (name === 'import-fail') {
      S.childErr = true; say('模拟导入失败（仍在导入窗口内）', 'mock import failure (still inside the import dialog)');
    } else if (name === 'import-ok') {
      S.child = null; S.childErr = false; S.hasNodes = true;
      if (wasStep === 0) S.step = 1;
      say('导入成功，出现可用节点，进入下一步', 'import succeeded; usable nodes exist, moved on');
    } else if (name === 'node-ok') {
      S.child = null; S.hasProxy = true;
      if (wasStep === 1) S.step = 2;
      say('选定节点，进入连接步骤', 'node chosen; moved to Connect');
    } else if (name === 'vpn-ok') {
      S.child = null; S.vpnOk = true; say('模拟授权通过，开始连接', 'mock permission granted; connecting'); startConnect();
    }
    render();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-child],[data-set],[data-flip],[data-do]');
    if (!el) return;
    if (el.dataset.act) { if (el.dataset.act !== 'noop') act(el.dataset.act); return; }
    if (el.dataset.child) { childAct(el.dataset.child); return; }
    if (el.dataset.set) {
      var k = el.dataset.set, v = el.dataset.val;
      S[k] = (k === 'big') ? Number(v) : v;
      render(); return;
    }
    if (el.dataset.flip) {
      var f = el.dataset.flip; S[f] = !S[f];
      if (f === 'hasNodes' && !S.hasNodes) S.hasProxy = false;
      render(); return;
    }
    if (el.dataset.do === 'sysback') { systemBack(); }
    else if (el.dataset.do === 'reopen') { S.dismissed = false; S.child = null; S.step = 0; lastRendered = null; say('从设置重新打开引导（不含任何凭据）', 'reopened from Settings (carries no credentials)'); render(); }
    else if (el.dataset.do === 'reset') { reset(); render(); }
  });

  function systemBack() {
    if (S.dismissed) return;
    if (S.child) { childAct('cancel'); return; }
    if (S.step === 0) act('skip'); else act('back');
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') systemBack(); });
  window.addEventListener('resize', function () { var svg = document.querySelector('[data-thread]'); if (svg) drawThread(svg, S.step, S.step === 2 && S.connected); });

  $('scrim').addEventListener('click', function () { if (S.width === 'tab') act('skip'); });
  render();
})();
</script>
</body>
</html>
