name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install locked Android toolchain
        run: sdkmanager "platforms;android-36" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bundled core hashes
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test "$(sha256sum app/src/main/jniLibs/$abi/libclash.so | cut -d' ' -f1)" = "$(sed -n "s/^libclash.$abi.sha256=//p" core-lock.properties)"
          done
      - name: Release audit
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
          bash tools/audit-local-release.sh
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache
      # The production key never lives in the repository. Without these secrets the workflow
      # still publishes unsigned APKs plus checksums so the build can be reproduced and signed.
      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WEAVE_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "WEAVE_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build all ABIs
        env:
          WEAVE_RELEASE_STORE_PASSWORD: ${{ secrets.WEAVE_RELEASE_STORE_PASSWORD }}
          WEAVE_RELEASE_KEY_ALIAS: ${{ secrets.WEAVE_RELEASE_KEY_ALIAS }}
          WEAVE_RELEASE_KEY_PASSWORD: ${{ secrets.WEAVE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
      - name: Collect artifacts, checksums and SBOM
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release(-unsigned)?\.apk$/\1/')"
            suffix=""; case "$apk" in *-unsigned.apk) suffix="-unsigned";; esac
            cp "$apk" "dist/Weave-${version}-${abi}${suffix}.apk"
          done
          test -z "$(find dist -iname '*universal*' -print -quit)"
          python3 tools/generate-sbom.py --version "$version" --output "dist/Weave-${version}.cdx.json"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: dist/*
