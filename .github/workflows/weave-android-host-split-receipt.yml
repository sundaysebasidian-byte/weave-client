name: Weave cumulative Android host acceptance with split APK receipt

on:
  push:
    branches: [dot/weave-android-round001]
    paths:
      - '.github/workflows/weave-android-host-split-receipt.yml'

permissions:
  contents: read

jobs:
  android-host-acceptance:
    name: Cumulative Android host acceptance with four ABI splits
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install the project's locked Android toolchain
        run: sdkmanager "build-tools;36.0.0" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run full unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --continue --console=plain --no-build-cache --no-daemon --no-configuration-cache
      - name: Verify host test receipts and four signed debug APK splits
        shell: bash
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          ABIS = {"arm64-v8a", "armeabi-v7a", "x86", "x86_64"}
          APP_ID = "io.weave.client"
          VERSION_CODE = 110
          VERSION_NAME = "0.4.0-rc4"
          BUILD_TOOLS = "36.0.0"

          def expected_outputs(metadata):
              if (metadata.get("version") != 3 or metadata.get("artifactType", {}).get("type") != "APK"
                      or metadata.get("applicationId") != APP_ID or metadata.get("variantName") != "debug"):
                  raise ValueError("Unexpected AGP debug APK metadata")
              outputs = {}
              for entry in metadata.get("elements", []):
                  filters = entry.get("filters", [])
                  if (entry.get("type") != "ONE_OF_MANY" or len(filters) != 1
                          or filters[0].get("filterType") != "ABI"):
                      raise ValueError("Expected one ABI filter per split and no universal APK")
                  abi = filters[0].get("identifier")
                  name = entry.get("outputFile")
                  if (abi not in ABIS or abi in outputs or name in outputs.values()
                          or not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*[.]apk", name)):
                      raise ValueError("Missing, unexpected, or duplicate ABI split")
                  if entry.get("versionCode") != VERSION_CODE or entry.get("versionName") != VERSION_NAME:
                      raise ValueError("Unexpected variant version in AGP metadata")
                  outputs[abi] = name
              if set(outputs) != ABIS:
                  raise ValueError("AGP did not produce the four configured ABI splits")
              return outputs

          def verify_manifest(badging):
              line = next((line for line in badging.splitlines() if line.startswith("package: ")), "")
              fields = dict(re.findall(r"(\w+)='([^']*)'", line))
              if (fields.get("name"), fields.get("versionCode"), fields.get("versionName")) != (
                  APP_ID, str(VERSION_CODE), VERSION_NAME,
              ):
                  raise ValueError("APK manifest version or package differs from the expected debug build")

          def verify_native_abi(archive, abi):
              packaged = {parts[1] for name in archive.namelist()
                          if len(parts := name.split("/")) == 3 and parts[0] == "lib" and parts[2].endswith(".so")}
              if packaged != {abi}:
                  raise ValueError("APK native library ABI differs from its AGP split")

          def stream_sha256(stream):
              digest = hashlib.sha256()
              for chunk in iter(lambda: stream.read(65536), b""):
                  digest.update(chunk)
              return digest.hexdigest()

          def unit_receipt():
              reports = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
              keys = ("tests", "failures", "errors", "skipped")
              totals = dict.fromkeys(keys, 0)
              audit_ran = False
              for report in reports:
                  suite = ET.parse(report).getroot()
                  counts = {key: int(suite.get(key, "0")) for key in keys}
                  for key, value in counts.items():
                      totals[key] += value
                  if suite.get("name") == "io.weave.client.ui.CompleteLanguageCoverageTest":
                      audit_ran = counts["tests"] > counts["skipped"]
              if not reports or totals["tests"] <= totals["skipped"] or totals["failures"] or totals["errors"] or not audit_ran:
                  raise ValueError("Missing or failing cumulative unit or language-audit receipt")
              return {"suite_count": len(reports), **totals}

          def sdk_tool(tool):
              sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
              if not sdk:
                  raise ValueError("Android SDK environment is missing")
              path = Path(sdk) / "build-tools" / BUILD_TOOLS / tool
              if not path.is_file() or not os.access(path, os.X_OK):
                  raise ValueError(f"SDK Build Tools {BUILD_TOOLS} does not provide executable {tool}")
              return path

          def run_tool(executable, *args):
              result = subprocess.run([executable, *args], capture_output=True, text=True, check=False, timeout=90)
              if result.returncode:
                  raise ValueError(f"{executable.name} failed for {Path(args[-1]).name}")
              return result.stdout

          def main():
              receipt = unit_receipt()
              directory = Path("app/build/outputs/apk/debug")
              outputs = expected_outputs(json.loads((directory / "output-metadata.json").read_text(encoding="utf-8")))
              if {item.name for item in directory.glob("*.apk")} != set(outputs.values()):
                  raise ValueError("Debug output directory does not match the AGP metadata")
              apksigner, aapt2 = sdk_tool("apksigner"), sdk_tool("aapt2")
              splits = {}
              for abi, name in sorted(outputs.items()):
                  apk = directory / name
                  if apk.is_symlink() or not apk.is_file() or apk.stat().st_size == 0:
                      raise ValueError(f"Missing debug split file for {abi}")
                  run_tool(apksigner, "verify", apk)
                  verify_manifest(run_tool(aapt2, "dump", "badging", apk))
                  with zipfile.ZipFile(apk) as archive:
                      verify_native_abi(archive, abi)
                  with apk.open("rb") as stream:
                      splits[abi] = {"apk": name, "bytes": apk.stat().st_size, "sha256": stream_sha256(stream),
                                     "signature_verified": True}
              print(json.dumps({"commit": os.environ["GITHUB_SHA"], **receipt, "variant": "debug",
                                "application_id": APP_ID, "version_code": VERSION_CODE, "version_name": VERSION_NAME,
                                "sdk_build_tools": BUILD_TOOLS, "debug_apk_splits": splits}))

          try:
              main()
          except (OSError, ValueError, ET.ParseError, subprocess.TimeoutExpired, zipfile.BadZipFile) as error:
              raise SystemExit(f"Host receipt failed: {error}")
          PY
