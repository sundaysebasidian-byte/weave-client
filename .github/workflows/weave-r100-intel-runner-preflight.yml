name: Weave exact historical Android R001 acceptance
on:
  push:
    branches: [dot/weave-android-r100-runner-preflight]
    paths: ['.github/workflows/weave-r100-intel-runner-preflight.yml']
permissions:
  contents: read
jobs:
  r001:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out the exact historical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          persist-credentials: false
      - name: Build isolated APKs and run the exact R001 device test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          git diff --exit-code
          test "$(uname -m)" = x86_64
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?}}"
          sdk="$ANDROID_HOME"
          shopt -s nullglob
          sdkmanager=''
          for bin in "$sdk"/cmdline-tools/latest/bin "$sdk"/cmdline-tools/*/bin "$sdk"/tools/bin; do
            if [[ -x "$bin/sdkmanager" && -x "$bin/avdmanager" ]]; then
              sdkmanager="$bin/sdkmanager"
              export WEAVE_AVDMANAGER="$bin/avdmanager"
              break
            fi
          done
          test -n "$sdkmanager"
          echo "Using stock command-line tools from ${sdkmanager%/*}"
          "$sdkmanager" 'platform-tools' 'build-tools;37.0.0' 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.31.6' 'system-images;android-36;google_apis;x86_64'
          die() { printf '::error::%s\n' "$1" >&2; exit 1; }
          printf 'Runner class: %s, OS: %s, arch: %s\n' "${RUNNER_ENVIRONMENT:-unset}" "$(uname -s)" "$(uname -m)"
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]] || die "Expected GitHub-hosted runner"
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]] || die "Expected Intel macOS runner"
          [[ -d ${RUNNER_TEMP:-} && -w $RUNNER_TEMP ]] || die "Runner temporary directory is unavailable"
          isolated="$(mktemp -d "$RUNNER_TEMP/weave-exact-r001.XXXXXX")" || die "Cannot create isolated runner directory"
          [[ -x "$sdk/platform-tools/adb" ]] || die "Missing SDK adb"
          [[ -x "$WEAVE_AVDMANAGER" ]] || die "Missing SDK avdmanager"
          [[ -x "$sdk/emulator/emulator" ]] || die "Missing SDK emulator"
          [[ -d "$sdk/system-images/android-36/google_apis/x86_64" ]] || die "Missing Android 36 Google APIs x86_64 image"
          export WEAVE_AAPT="$sdk/build-tools/37.0.0/aapt2"
          [[ -x "$WEAVE_AAPT" ]] || die "Missing SDK build-tools 37.0.0 aapt2"
          [[ "$(/usr/sbin/sysctl -n kern.hv_support)" == 1 ]] || die "Intel hardware virtualization unavailable"
          "$sdk/emulator/emulator" -accel-check >"$isolated/acceleration.txt" 2>&1 || { cat "$isolated/acceleration.txt"; die "Android emulator acceleration check failed"; }
          cat "$isolated/acceleration.txt"
          grep -q 'Hypervisor.Framework' "$isolated/acceleration.txt" || die "Expected Hypervisor.Framework backend"
          echo "Hosted Intel runner and SDK preflight passed; no emulator has started"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PweaveDeviceTest=true --no-daemon --no-configuration-cache
          cat >"$isolated/verify-receipt.py" <<'RECEIPT_PY'
          """Validate only the exact requested JUnit method and explicitly expected outcome."""
          from pathlib import Path
          import re
          import sys

          mode, clazz, method, path = sys.argv[1:]
          body = Path(path).read_text()
          lines = body.splitlines()
          assert not re.search(r"INSTRUMENTATION_(?:FAILED|ABORTED)|Process crashed", body, re.I)
          assert f"INSTRUMENTATION_STATUS: class={clazz}" in lines
          assert f"INSTRUMENTATION_STATUS: test={method}" in lines
          assert lines.count("INSTRUMENTATION_CODE: -1") == 1
          codes = re.findall(r"^INSTRUMENTATION_STATUS_CODE: (-?\d+)$", body, re.M)
          if mode == "backup-negative":
              assert codes == ["1", "-2"], codes
              assert re.search(r"Tests run:\s*1,\s*Failures:\s*1\b", body), body
              assert re.search(r"AssertionError: one post-commit refresh publication", body), body
              assert "restore must have committed its synthetic palette" not in body
              print("Expected negative result: durable commit reached, post-commit UI publication assertion failed.")
          else:
              assert codes == ["1", "0"], codes
              assert lines.count("OK (1 test)") == 1 and "FAILURES!!!" not in body
              print("Exact isolated Android JUnit method passed.")
          RECEIPT_PY
          cat >"$isolated/acceptance.sh" <<'ACCEPTANCE_BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
          mode=${1:?use r001, backup-positive, or backup-negative}
          case "$mode" in
            r001) class=io.weave.client.ui.ImportViewModelIntegrationTest; method=persistedImportUnblocksWithoutResavingOrReloadingAfterNodeReadFails ;;
            backup-positive|backup-negative) class=io.weave.client.ui.BackupStateOwnershipIntegrationTest; method=settingsReentryPreservesTheOwnerAndACommittedRestoreRefreshesOnce ;;
            *) exit 64 ;;
          esac
          export ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:?}}
          sdk=$ANDROID_HOME
          export WEAVE_ISOLATED_EMULATOR=1 WEAVE_TEST_ADB_PORT=5037 WEAVE_TEST_BOOT_TIMEOUT=900
          export ANDROID_ADB_SERVER_PORT=$WEAVE_TEST_ADB_PORT ADB_MDNS_AUTO_CONNECT=''
          serial=emulator-5554
          private_dir="$(mktemp -d "${RUNNER_TEMP:?}/weave-intel.XXXXXX")"
          out="${RUNNER_TEMP}/weave-intel-receipt"
          mkdir "$out"
          export ANDROID_AVD_HOME="$private_dir/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          bounded() {
            python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:],timeout=int(sys.argv[1])).returncode)' "$@"
          }
          adb="$sdk/platform-tools/adb"
          emulator="$sdk/emulator/emulator"
          avdmanager="${WEAVE_AVDMANAGER:?}"
          aapt="$sdk/build-tools/37.0.0/aapt"
          # If the known runner/build requests another aapt build-tools version, configure its exact path.
          aapt="${WEAVE_AAPT:-$aapt}"
          image="${WEAVE_AVD_IMAGE:-system-images;android-36;google_apis;x86_64}"
          echo "Starting isolated ADB and AVD setup"
          set -E
          trap 'printf "::error::R001 device phase failed at script line %s\n" "$LINENO" >&2' ERR
          run_adb() { bounded 45 "$adb" -P "$WEAVE_TEST_ADB_PORT" "$@"; }
          emulator_pid=''
          cleanup() {
            if [[ -n "$emulator_pid" ]]; then kill "$emulator_pid" 2>/dev/null || :; fi
            bounded 10 "$adb" -P "$WEAVE_TEST_ADB_PORT" kill-server || :
          }
          trap cleanup EXIT
          run_adb start-server
          [[ "$(run_adb devices | awk 'NR > 1 && NF {print}')" == '' ]]
          printf 'no\n' | bounded 60 "$avdmanager" create avd -n weave_gate -k "$image"
          echo "Launching Android 36 Google APIs with the proven Intel boot configuration"
          "$emulator" -avd weave_gate -port 5554 -no-window -no-boot-anim -no-audio -no-snapshot -accel on -gpu swiftshader -memory 2048 -show-kernel >"$out/emulator.log" 2>&1 &
          emulator_pid=$!
          export WEAVE_TEST_EMULATOR_PID="$emulator_pid"
          python3 tools/wait-android-ready.py "$serial" | tee "$out/readiness.txt"
          guest() { run_adb -s "$serial" shell "$@" | tr -d '\r'; }
          [[ "$(guest getprop ro.kernel.qemu)" == 1 && "$(guest getprop ro.product.cpu.abi)" == x86_64 ]]
          [[ "$(guest getprop ro.build.version.sdk)" == 36 && "$(guest am get-current-user)" == 0 ]]
          app=app/build/outputs/apk/debug/app-x86_64-debug.apk
          tests=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$app" || { echo '::error::Missing x86_64 application APK'; exit 1; }
          test -s "$tests" || { echo '::error::Missing test APK'; exit 1; }
          app_id=io.weave.client.acceptance
          test_id=io.weave.client.acceptance.test
          package_id() { "$aapt" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p"; }
          [[ "$(package_id "$app")" == "$app_id" && "$(package_id "$tests")" == "$test_id" ]] || { echo '::error::APK package IDs do not match the isolated test IDs'; exit 1; }
          [[ "$(guest pm list packages "$app_id")" == "" ]] # Never replace or clear an existing profile.
          shasum -a 256 "$app" "$tests" | tee "$out/apk-sha256.txt"
          run_adb -s "$serial" install --user 0 "$app"
          run_adb -s "$serial" install --user 0 "$tests"
          runner="$test_id/androidx.test.runner.AndroidJUnitRunner"
          guest pm list instrumentation "$app_id" | grep -Fx "instrumentation:$runner (target=$app_id)"
          bounded 120 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell cmd package compile -m verify -f "$app_id"
          bounded 120 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell cmd package compile -m verify -f "$test_id"
          bounded 240 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell am instrument --user 0 -w -r \
            -e class "$class#$method" -e weaveIsolatedEmulator 1 -e weaveFreshBackupProfile 1 "$runner" |
            tr -d '\r' | tee "$out/instrumentation.txt"
          python3 "$(dirname "$0")/verify-receipt.py" "$mode" "$class" "$method" "$out/instrumentation.txt"
          ACCEPTANCE_BASH
          bash "$isolated/acceptance.sh" r001
