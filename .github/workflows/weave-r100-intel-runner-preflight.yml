name: Weave Android acceptance runner capability
on:
  push:
    branches: [dot/weave-android-r100-runner-preflight]
    paths: ['.github/workflows/weave-r100-intel-runner-preflight.yml']
permissions: {}
jobs:
  emulator-capability:
    runs-on: macos-15-intel
    timeout-minutes: 21
    steps:
      - name: Read the runner capability without modifying it
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = x86_64
          /usr/sbin/sysctl kern.hv_support || true
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -x "$sdk/emulator/emulator" ]]; then
            echo 'Stock image does not provide the Android emulator binary.'
            exit 1
          fi
          "$sdk/emulator/emulator" -version
          "$sdk/emulator/emulator" -accel-check
          echo 'Emulator acceleration capability only; no Android boot or app test performed.'
      - name: Diagnose Android guest startup and ADB separately
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          shopt -s nullglob
          sdkmanager=''
          avdmanager=''
          for tools_bin in "$sdk"/cmdline-tools/latest/bin "$sdk"/cmdline-tools/*/bin "$sdk"/tools/bin; do
            if [[ -x "$tools_bin/sdkmanager" && -x "$tools_bin/avdmanager" ]]; then
              sdkmanager="$tools_bin/sdkmanager"
              avdmanager="$tools_bin/avdmanager"
              break
            fi
          done
          if [[ -z "$sdkmanager" ]]; then
            echo 'Android SDK has no stock command-line tools; emulator did not start.'
            exit 1
          fi
          echo "Using stock command-line tools from $sdkmanager"
          image='system-images;android-36;google_apis;x86_64'
          "$sdkmanager" 'platform-tools' "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/weave-r100-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$avdmanager" create avd -n weave-r100-boot -k "$image" --force
          adb="$sdk/platform-tools/adb"
          log="$RUNNER_TEMP/weave-r100-emulator.log"
          "$adb" version
          "$adb" start-server
          "$adb" devices
          "$sdk/emulator/emulator" @weave-r100-boot -port 5554 -no-window -no-boot-anim -no-audio -no-snapshot -accel on -gpu swiftshader -memory 2048 -show-kernel >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; grep -Eai "kernel panic|unable to|failed to|watchdog|boot completed|system_server|zygote|init: starting|fatal" "$log" | grep -viE "pubkey|token|auth" | tail -n 24 || true' EXIT
          python3 - "$adb" "$pid" <<'PY'
          import os
          import subprocess
          import sys
          import time

          adb, pid_text = sys.argv[1:]
          pid = int(pid_text)
          serial = "emulator-5554"

          def query(*args):
              try:
                  p = subprocess.run([adb, *args], capture_output=True, text=True, timeout=5)
              except subprocess.TimeoutExpired:
                  return "timeout"
              return (p.stdout.strip() if p.returncode == 0 else "unavailable").replace("\r", "")

          deadline = time.monotonic() + 540
          previous = None
          while time.monotonic() < deadline:
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  sys.exit("Emulator process exited before Android was ready.")
              listed = [row.split()[1] for row in query("devices").splitlines()
                        if row.startswith(serial + "\t") and len(row.split()) == 2]
              state = listed[0] if listed else "not-discovered"
              boot = pkg = activity = "not-queried"
              if state == "device":
                  boot = query("-s", serial, "shell", "getprop", "sys.boot_completed")
                  pkg = query("-s", serial, "shell", "service", "check", "package")
                  activity = query("-s", serial, "shell", "service", "check", "activity")
              summary = (state, boot, pkg, activity)
              if summary != previous:
                  print(f"ADB={state!r} boot_completed={boot!r} package={pkg!r} activity={activity!r}", flush=True)
                  previous = summary
              if boot == "1" and pkg == "Service package: found" and activity == "Service activity: found":
                  sdk = query("-s", serial, "shell", "getprop", "ro.build.version.sdk")
                  abi = query("-s", serial, "shell", "getprop", "ro.product.cpu.abi")
                  if (sdk, abi) != ("36", "x86_64"):
                      sys.exit(f"Unexpected ready emulator: SDK={sdk!r} ABI={abi!r}")
                  print("Android 36 x86_64 and both services verified; no APK installed.", flush=True)
                  break
              time.sleep(5)
          else:
              sys.exit(f"Android readiness deadline expired; last state {previous!r}.")
          PY
