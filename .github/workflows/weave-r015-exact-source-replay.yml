name: Weave R015 supplemental exact-source host replay

on:
  push:
    branches: [dot/weave-android-round001]
    paths:
      - '.github/workflows/weave-r015-exact-source-replay.yml'

# Public immutable source only; no checkout token, PR event, secrets, caching or upload.
permissions: {}

jobs:
  r015-host-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch the two pinned public source commits
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          git init -q r015-source
          git -C r015-source -c credential.helper= -c credential.interactive=never \
            fetch --no-tags --depth=1 https://github.com/sundaysebasidian-byte/weave-client.git \
            a0d788fd00788fc7bf63d77de77b3d002413a729 56149c6329ba5061646859b9b106b0eb9a653bc8
          git -C r015-source checkout -q --detach a0d788fd00788fc7bf63d77de77b3d002413a729
          test "$(git -C r015-source rev-parse HEAD)" = a0d788fd00788fc7bf63d77de77b3d002413a729
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install existing Android build requirements
        run: sdkmanager "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Generate exactly pinned ephemeral host fixture
        shell: bash
        working-directory: r015-source
        run: |
          cat > "$RUNNER_TEMP/r015-prepare.py" <<'R015_PYTHON'
          #!/usr/bin/env python3
          from argparse import ArgumentParser
          from hashlib import sha256
          from pathlib import Path
          from subprocess import check_output

          CURRENT = "a0d788fd00788fc7bf63d77de77b3d002413a729"
          HISTORICAL = "56149c6329ba5061646859b9b106b0eb9a653bc8"
          VM_PATH = "app/src/main/java/io/weave/client/ui/AppViewModel.kt"
          OWNER_PATH = "app/src/main/java/io/weave/client/ui/PassiveSubscriptionHealthRead.java"
          OUTPUT = "app/src/test/java/io/weave/client/ui/R015SourceReplayTest.kt"
          FINGERPRINTS = {
              CURRENT: ["b7af707dba70c481109f0fdff84a8dd85ff211314283ba94f0fa6578f69ed3cc", "a88d28181954ef2a88b39b2d444727ecb1e404d7daa4ae4c6c0affb3d654a666"],
              HISTORICAL: ["d0b826bbbcb24cde211f2d62d38b729b25633d8383b5917ccbf2be172ef920a9", "571a9e7f1ba76bfff342718acad59b8400c6feb4df538d921a635381887561b1"],
          }
          OWNER = "176de00d8fe7bc8a8cd12f38ed5d6e82101805ed4b4e259e5256f3529e600184"
          CLASS_SCAFFOLD = """private class @@CLASS_NAME@@(
              private val viewModelScope: CoroutineScope,
              private val CoreClient: ReplayCore,
              private val VpnRuntimeState: ReplayRuntime,
          ) {
              private val subscriptionRepository = ReplayEditorRepository()
              private val WeaveVpnService = ReplayReload
              private val mutableEditorState = MutableStateFlow(SubscriptionEditorState())
              private val mutableSubscriptionHealth = MutableStateFlow(SubscriptionHealthState())
              private val healthCache = mutableMapOf<String, SubscriptionHealthState>()
              private val passiveHealthRead = PassiveSubscriptionHealthRead()
              private var activeHealthSubscriptionId: String? = null
              private var subscriptionHealthJob: Job? = null

              private fun discardUpdatePreview() = Unit
              private fun getApplication() = Unit

              val access = ReplayAccess(::openSubscriptionEditor, ::closeSubscriptionEditor, ::checkSubscriptionHealth) {
                  mutableSubscriptionHealth.value
              }

          @@EXACT_VM_METHODS@@
          }
          """

          def verify(data, expected, description):
              actual = sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{description}: SHA-256 mismatch ({actual})")

          def git_object(repo, commit, path):
              return check_output(["git", "-C", str(repo), "show", f"{commit}:{path}"])

          def methods(source, commit):
              verify(source, FINGERPRINTS[commit][0], f"{commit} {VM_PATH}")
              start_marker = b"    fun openSubscriptionEditor("
              end_marker = b"    fun renameSubscription("
              if source.count(start_marker) != 1 or source.count(end_marker) != 1:
                  raise SystemExit("Expected exactly one extraction boundary of each kind")
              body = source[source.index(start_marker):source.index(end_marker)]
              verify(body, FINGERPRINTS[commit][1], f"{commit} extracted source")
              if body.count(b"\n    fun ") != 3 or body.count(b"\n    private fun ") != 1:
                  raise SystemExit("Expected exactly five verbatim ownership methods")
              return body

          def generate(template, current, historic, owner):
              verify(owner, OWNER, OWNER_PATH)
              if template.count(b"@@REPLAY_CLASSES@@") != 1:
                  raise SystemExit("Expected exactly one test template placeholder")
              classes = []
              for name, data, commit in [
                  ("CurrentReplay", current, CURRENT),
                  ("HistoricalReplay", historic, HISTORICAL),
              ]:
                  # The public method bodies are copied without reindentation, replacement or translation.
                  scaffold = CLASS_SCAFFOLD.replace("@@CLASS_NAME@@", name).encode()
                  classes.append(scaffold.replace(b"@@EXACT_VM_METHODS@@", methods(data, commit), 1))
              return template.replace(b"@@REPLAY_CLASSES@@", b"\n".join(classes), 1)

          def main():
              parser = ArgumentParser()
              parser.add_argument("repo", type=Path)
              parser.add_argument("template", type=Path)
              parser.add_argument("--emit", action="store_true")
              args = parser.parse_args()
              current = git_object(args.repo, CURRENT, VM_PATH)
              historic = git_object(args.repo, HISTORICAL, VM_PATH)
              owner = git_object(args.repo, CURRENT, OWNER_PATH)
              if (args.repo / VM_PATH).read_bytes() != current or (args.repo / OWNER_PATH).read_bytes() != owner:
                  raise SystemExit("Checked-out production ownership source differs from the pinned replay")
              result = generate(args.template.read_bytes(), current, historic, owner)
              print(f"R015 exact replay test SHA-256: {sha256(result).hexdigest()}")
              if args.emit:
                  # The intended path already exists and does not shadow present tests.
                  with (args.repo / OUTPUT).open("xb") as file:
                      file.write(result)

          if __name__ == "__main__":
              main()
          R015_PYTHON
          cat > "$RUNNER_TEMP/r015-Fixture.kt.in" <<'R015_KOTLIN'
          package io.weave.client.ui

          import io.weave.client.core.engine.NodeHealthSnapshot
          import kotlinx.coroutines.CompletableDeferred
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.channels.Channel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.update
          import kotlinx.coroutines.joinAll
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.runBlocking
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeout
          import java.util.concurrent.CancellationException
          import org.junit.Assert.*
          import org.junit.Test

          private class Reply<T>(val subscriptionId: String) {
              val result = CompletableDeferred<T>()
          }

          private class ReplayCore {
              val passive = Channel<Reply<List<NodeHealthSnapshot>?>>(Channel.UNLIMITED)
              val manual = Channel<Reply<Result<List<NodeHealthSnapshot>>>>(Channel.UNLIMITED)

              suspend fun querySubscriptionHealth(id: String): List<NodeHealthSnapshot>? =
                  Reply<List<NodeHealthSnapshot>?>(id).also { passive.send(it) }.result.await()

              suspend fun healthCheckSubscription(id: String): Result<List<NodeHealthSnapshot>> =
                  Reply<Result<List<NodeHealthSnapshot>>>(id).also { manual.send(it) }.result.await()
          }

          private data class ReplaySnapshot(val revision: Long, val ready: Boolean)

          private class ReplayRuntime {
              val snapshot = MutableStateFlow(ReplaySnapshot(revision = 1L, ready = true))
              fun acceptsEvidence(revision: Long): Boolean =
                  snapshot.value.let { it.revision == revision && it.ready }
          }

          private class ReplayEditorRepository {
              @Suppress("UNUSED_PARAMETER")
              fun loadEditor(subscriptionId: String): Nothing? = null
          }

          private object ReplayReload {
              @Suppress("UNUSED_PARAMETER")
              fun reload(context: Unit, probeSubscriptionId: String): Nothing =
                  error("Unexpected VPN reload in success/ownership-only fixture")
          }

          private data class ReplayAccess(
              val open: (String) -> Unit,
              val close: () -> Unit,
              val check: (String) -> Unit,
              val visible: () -> SubscriptionHealthState,
          )

          @@REPLAY_CLASSES@@

          private fun CoroutineScope.startedBy(action: () -> Unit): List<Job> {
              val parent = requireNotNull(coroutineContext[Job])
              val before = parent.children.toSet()
              action()
              return parent.children.filterNot { it in before }.toList()
          }

          class R015SourceReplayTest {
              private val passiveRows = listOf(NodeHealthSnapshot("passive", "VLESS", 40))
              private val manualRows = listOf(NodeHealthSnapshot("manual", "VLESS", 71))
              private val secondRows = listOf(NodeHealthSnapshot("other", "VLESS", 92))

              private fun CoroutineScope.bind(
                  historical: Boolean,
                  core: ReplayCore,
                  runtime: ReplayRuntime,
              ): ReplayAccess =
                  if (historical) HistoricalReplay(this, core, runtime).access
                  else CurrentReplay(this, core, runtime).access

              @Test fun passiveFinishingBeforeManualCannotClearRunningInCurrentSource() = runBlocking {
                  withTimeout(5_000) { replayLatePassive(afterManual = false) }
              }

              @Test fun passiveFinishingAfterManualCannotOverwriteManualInCurrentSource() = runBlocking {
                  withTimeout(5_000) { replayLatePassive(afterManual = true) }
              }

              private suspend fun CoroutineScope.replayLatePassive(afterManual: Boolean) {
                  for (historical in listOf(true, false)) {
                      val core = ReplayCore()
                      val replay = bind(historical, core, ReplayRuntime())
                      val passiveJobs = startedBy { replay.open("first") }
                      val passive = core.passive.receive()
                      val manualJobs = startedBy { replay.check("first") }
                      val manual = core.manual.receive()
                      assertEquals("first", passive.subscriptionId)
                      assertEquals("first", manual.subscriptionId)
                      assertTrue(replay.visible().running)

                      if (afterManual) {
                          manual.result.complete(Result.success(manualRows))
                          manualJobs.joinAll()
                          assertEquals(manualRows, replay.visible().nodes)
                      }
                      passive.result.complete(passiveRows)
                      passiveJobs.joinAll()

                      if (historical) {
                          assertEquals(passiveRows, replay.visible().nodes)
                          assertFalse(replay.visible().running)
                          assertNull(replay.visible().checkedAtMillis)
                      } else if (afterManual) {
                          assertEquals(manualRows, replay.visible().nodes)
                          assertNotNull(replay.visible().checkedAtMillis)
                      } else {
                          assertTrue(replay.visible().running)
                          assertNotEquals(passiveRows, replay.visible().nodes)
                      }

                      if (!afterManual) {
                          manual.result.complete(Result.success(manualRows))
                          manualJobs.joinAll()
                          assertEquals(manualRows, replay.visible().nodes)
                      }
                  }
              }

              @Test fun sameTargetCloseAndReopenPreservesCurrentManualRun() = runBlocking {
                  withTimeout(5_000) {
                      for (historical in listOf(true, false)) {
                          val core = ReplayCore()
                          val replay = bind(historical, core, ReplayRuntime())
                          val initial = startedBy { replay.open("first") }
                          core.passive.receive().result.complete(passiveRows)
                          initial.joinAll()
                          val manualJobs = startedBy { replay.check("first") }
                          val manual = core.manual.receive()
                          replay.close()
                          val reopen = startedBy { replay.open("first") }

                          if (historical) core.passive.receive().result.complete(passiveRows)
                          reopen.joinAll()
                          assertEquals("first", replay.visible().subscriptionId)
                          if (historical) {
                              assertEquals(passiveRows, replay.visible().nodes)
                              assertFalse(replay.visible().running)
                          } else {
                              assertTrue(replay.visible().running)
                              assertNull(core.passive.tryReceive().getOrNull())
                          }
                          manual.result.complete(Result.success(manualRows))
                          manualJobs.joinAll()
                          assertEquals(manualRows, replay.visible().nodes)
                      }
                  }
              }

              @Test fun closingAndReopeningTheSameIdSupersedesTheEarlierPassiveRead() = runBlocking {
                  withTimeout(5_000) {
                      for (historical in listOf(true, false)) {
                          val core = ReplayCore()
                          val replay = bind(historical, core, ReplayRuntime())
                          val oldJobs = startedBy { replay.open("first") }
                          val old = core.passive.receive()
                          replay.close()
                          val currentJobs = startedBy { replay.open("first") }
                          val current = core.passive.receive()
                          assertEquals("first", old.subscriptionId)
                          assertEquals("first", current.subscriptionId)

                          current.result.complete(secondRows)
                          currentJobs.joinAll()
                          assertEquals(secondRows, replay.visible().nodes)

                          old.result.complete(passiveRows)
                          oldJobs.joinAll()
                          assertEquals("first", replay.visible().subscriptionId)
                          if (historical) {
                              // The old ID-only guard accepts the first read after reopening the same ID.
                              assertEquals(passiveRows, replay.visible().nodes)
                          } else {
                              assertEquals(secondRows, replay.visible().nodes)
                          }
                      }
                  }
              }

              @Test fun lateReadCannotOverwriteTheNewEditorTarget() = runBlocking {
                  withTimeout(5_000) {
                      for (historical in listOf(true, false)) {
                          val core = ReplayCore()
                          val replay = bind(historical, core, ReplayRuntime())
                          val firstJobs = startedBy { replay.open("first") }
                          val first = core.passive.receive()
                          val secondJobs = startedBy { replay.open("second") }
                          val second = core.passive.receive()
                          assertEquals("first", first.subscriptionId)
                          assertEquals("second", second.subscriptionId)
                          second.result.complete(secondRows)
                          secondJobs.joinAll()
                          first.result.complete(passiveRows)
                          firstJobs.joinAll()
                          assertEquals("second", replay.visible().subscriptionId)
                          assertEquals(secondRows, replay.visible().nodes)
                      }
                  }
              }

              @Test fun disconnectedCheckDoesNotDispatchManualOrAcceptOldPassive() = runBlocking {
                  withTimeout(5_000) {
                      for (historical in listOf(true, false)) {
                          val core = ReplayCore()
                          val runtime = ReplayRuntime()
                          val replay = bind(historical, core, runtime)
                          val oldJobs = startedBy { replay.open("first") }
                          val passive = core.passive.receive()
                          runtime.snapshot.value = ReplaySnapshot(revision = 2L, ready = false)
                          assertTrue(startedBy { replay.check("first") }.isEmpty())
                          assertNull(core.manual.tryReceive().getOrNull())
                          val disconnected = replay.visible()
                          assertNotNull(disconnected.error)
                          assertFalse(disconnected.running)
                          passive.result.complete(passiveRows)
                          oldJobs.joinAll()
                          assertEquals(disconnected, replay.visible())
                      }
                  }
              }
          }
          R015_KOTLIN
          test "$(sha256sum "$RUNNER_TEMP/r015-prepare.py" | cut -d' ' -f1)" = 4d574ddab535824a94abcfe3ba5314eecb5456437589c6028c6dfb52dacfd0a8
          test "$(sha256sum "$RUNNER_TEMP/r015-Fixture.kt.in" | cut -d' ' -f1)" = 155286a9e75574758165190a98472497fe8c0d47982e82f51fd231799034f915
          python3 "$RUNNER_TEMP/r015-prepare.py" "$PWD" "$RUNNER_TEMP/r015-Fixture.kt.in" --emit
          test "$(sha256sum app/src/test/java/io/weave/client/ui/R015SourceReplayTest.kt | cut -d' ' -f1)" = 114a6090abcd5269b2a34b2e4ca43c44a386516c1c874e977aef00d62a01470c
      - name: Execute only the synthetic R015 host replay
        id: replay
        working-directory: r015-source
        run: ./gradlew :app:testDebugUnitTest --tests io.weave.client.ui.R015SourceReplayTest --console=plain --no-build-cache --no-daemon --no-configuration-cache
      - name: Report focused checkout and test receipt
        if: always()
        shell: bash
        working-directory: r015-source
        env:
          GRADLE_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          template = Path(os.environ["RUNNER_TEMP"]) / "r015-Fixture.kt.in"
          preparer = Path(os.environ["RUNNER_TEMP"]) / "r015-prepare.py"
          fixture = Path("app/src/test/java/io/weave/client/ui/R015SourceReplayTest.kt")
          junit = Path("app/build/test-results/testDebugUnitTest/TEST-io.weave.client.ui.R015SourceReplayTest.xml")
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          counts = dict.fromkeys(("tests", "failures", "errors", "skipped"), None)
          if junit.is_file():
              suite = ET.parse(junit).getroot()
              if suite.get("name") == "io.weave.client.ui.R015SourceReplayTest":
                  counts = {key: int(suite.get(key, "0")) for key in counts}
          result = {
              "current_source": "a0d788fd00788fc7bf63d77de77b3d002413a729",
              "historical_source": "56149c6329ba5061646859b9b106b0eb9a653bc8",
              "generator_sha256": digest(preparer),
              "template_sha256": digest(template),
              "generated_test_sha256": digest(fixture),
              "gradle": os.environ["GRADLE_OUTCOME"],
              **counts,
          }
          print(json.dumps(result, sort_keys=True))
          if (result["gradle"] != "success" or counts != dict(tests=6, failures=0, errors=0, skipped=0)
                  or (result["generator_sha256"], result["template_sha256"], result["generated_test_sha256"])
                  != ("4d574ddab535824a94abcfe3ba5314eecb5456437589c6028c6dfb52dacfd0a8", "155286a9e75574758165190a98472497fe8c0d47982e82f51fd231799034f915", "114a6090abcd5269b2a34b2e4ca43c44a386516c1c874e977aef00d62a01470c")):
              raise SystemExit("Missing or failing exact R015 supplemental receipt")
          PY
      - name: Remove ephemeral replay files
        if: always()
        shell: bash
        run: |
          rm -f -- r015-source/app/src/test/java/io/weave/client/ui/R015SourceReplayTest.kt \
            "$RUNNER_TEMP/r015-prepare.py" "$RUNNER_TEMP/r015-Fixture.kt.in"
