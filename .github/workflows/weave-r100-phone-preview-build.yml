          done
          (
            cd "$out"
            sha256sum positive/*.apk negative/*.apk > SHA256SUMS
            printf 'Physical fixture SHA-256: %s\nBuild only. No handset was accessed.\n' '0b71d95423d10cd7173ef9576a92cd376305ebd94ba19e4a36ba5cc28a822924' > scope.txt
          )
