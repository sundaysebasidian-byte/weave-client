          from pathlib import Path
          import base64, gzip, hashlib, json, sys
          kit = Path(sys.argv[1])
          packed = base64.b64decode(b"".join((kit/"bundle.b64").read_bytes().split()), validate=True)
          assert hashlib.sha256(packed).hexdigest() == "74ebb7af320f277488f6d93569a25d462ac0beed8a61491fbbb1cbae8759c346"
