          PHONE_B64
          python3 - "$kit" <<'PYTHON'
          from pathlib import Path
          import base64, gzip, hashlib, json, sys
          kit = Path(sys.argv[1])
          packed = base64.b64decode(b"".join((kit/"bundle.b64").read_bytes().split()), validate=True)
          assert hashlib.sha256(packed).hexdigest() == "9d9932f91f1af9ab9d523f25580d1fcb69a337779005db121f6e6913fb62d355"
          files = json.loads(gzip.decompress(packed))
          assert set(files) == {"stage-variant.py","pending-intent-identity.patch","RoutesScreen.eager.kt","RoutesCompositionGateAndroidTest.kt","physical.kt"}
          for name, data in files.items():
              (kit/name).write_bytes(data.encode())
          PYTHON
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?}}"
          shopt -s nullglob
          sdkmanager=''
          for tool in "$sdk"/cmdline-tools/latest/bin/sdkmanager "$sdk"/cmdline-tools/*/bin/sdkmanager "$sdk"/tools/bin/sdkmanager; do
            if [[ -x "$tool" ]]; then sdkmanager="$tool"; break; fi
          done
          test -n "$sdkmanager"
          "$sdkmanager" 'build-tools;37.0.0' 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
          aapt="$sdk/build-tools/37.0.0/aapt2"
          apksigner="$sdk/build-tools/37.0.0/apksigner"
          overlay="$(realpath ../fixture/tools/acceptance/r100-appearance-delta.json.gz.b64)"
          floor=70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          fixture=app/src/androidTest/java/io/weave/client/ui/RoutesCompositionGateAndroidTest.kt
          for mode in positive negative; do
            mkdir "$out/$mode"
            tree="$kit/$mode"
            git worktree add --detach "$tree" "$floor"
            python3 "$kit/stage-variant.py" "$mode" "$overlay" "$tree" "$out/$mode/source-proof.json"
            (
              cd "$tree"
              cp "$kit/physical.kt" "$fixture"
              printf '%s  %s\n' '0b71d95423d10cd7173ef9576a92cd376305ebd94ba19e4a36ba5cc28a822924' "$fixture" | sha256sum -c
              ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PweaveDeviceTest=true -PweaveArm64Only=true --no-daemon --no-configuration-cache
              app=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
              test=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
              "$aapt" dump badging "$app" > "$kit/app.badging"
              "$aapt" dump badging "$test" > "$kit/test.badging"
              grep -E "^package: name='io[.]weave[.]client[.]acceptance' " "$kit/app.badging"
              grep -Fx "native-code: 'arm64-v8a'" "$kit/app.badging"
              grep -E "^package: name='io[.]weave[.]client[.]acceptance[.]test' " "$kit/test.badging"
              "$aapt" dump xmltree --file AndroidManifest.xml "$test" > "$kit/test.manifest"
              grep -E 'android:targetPackage[^=]*="io[.]weave[.]client[.]acceptance"' "$kit/test.manifest"
              "$apksigner" verify --print-certs "$app" > "$kit/app.cert"
              "$apksigner" verify --print-certs "$test" > "$kit/test.cert"
              grep 'certificate SHA-256 digest:' "$kit/app.cert" > "$out/$mode/signer.txt"
              grep 'certificate SHA-256 digest:' "$kit/test.cert" | diff "$out/$mode/signer.txt" -
              cp "$app" "$out/$mode/weave-isolated-arm64.apk"
              cp "$test" "$out/$mode/weave-routes-instrumentation.apk"
