          #!/usr/bin/env bash
          set -euo pipefail
          mode=${1:?positive or negative}
          patch=${2:?fixture path}
          proof=${3:?source proof file}
          floor=70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          folder=app/src/main/java/io/weave/client/ui
          model=$folder/AppViewModel.kt
          restore=$folder/BackupRestoreUi.kt
          test_source=app/src/androidTest/java/io/weave/client/ui/BackupStateOwnershipIntegrationTest.kt
          ready=tools/wait-android-ready.py
          fixture_sha=eeb86cfd569f98a41af379af0a3fbd190915664b23c856e6a7b451dbe538e809
          [[ "$mode" == positive || "$mode" == negative ]]
          [[ "$(git rev-parse HEAD)" == "$floor" ]]
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$source_status" ]]
          [[ "$(shasum -a 256 "$patch" | awk '{print $1}')" == "$fixture_sha" ]]
          [[ "$(git hash-object "$test_source")" == a262a792aa7e84c7c33ecbbe89f8472f1d6a8c9d ]]
          [[ "$(git hash-object "$model")" == b551c14ec25b57f45df2b9721302617ec7e1a2a9 ]]
          [[ "$(git hash-object "$restore")" == 60a0041fec79135331bfc763c49e984b06a5fec0 ]]
          [[ "$(git hash-object "$ready")" == 3b1a7e3178bdaa3da7ba0a9d7101ee155c092ba8 ]]
          git apply --check "$patch"
          git apply "$patch"
          [[ "$(git hash-object "$test_source")" == 56674bacaeda4d3418f25a51de38d531deafbc67 ]]

          if [[ "$mode" == negative ]]; then
            python3 - "$model" <<'MUTATE_PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          before = path.read_bytes()
          guard = b"        if (mutableBackupState.value.running) return\n"
          target = (
              b"    fun discardBackupState() {\n"
              b"        // The Activity can be recreated while this ViewModel still owns active backup work.\n"
              + guard + b"        backupGeneration++\n"
          )
          if before.count(target) != 1:
              raise SystemExit("Expected one exact historical R019 guard")
          path.write_bytes(before.replace(target, target.replace(guard, b""), 1))
          MUTATE_PY
            [[ "$(git diff --numstat -- "$model")" == "$(printf '0\t1\t%s' "$model")" ]]
            [[ "$(git hash-object "$model")" == 2be7d7bf385dbaa011a3e6b6a17015001e8303ca ]]
            [[ "$(git diff --name-only)" == "$(printf '%s\n%s' "$test_source" "$model")" ]]
          else
            [[ "$(git diff --name-only)" == "$test_source" ]]
          fi
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          git diff --check
          {
            printf 'source_floor=%s\nfixture_sha256=%s\nworkflow_sha=%s\nmode=%s\n' "$floor" "$fixture_sha" "${GITHUB_SHA:?}" "$mode"
            printf 'test_blob=%s\nmodel_blob=%s\nrestore_blob=%s\nreadiness_blob=%s\n' \
              "$(git hash-object "$test_source")" "$(git hash-object "$model")" \
              "$(git hash-object "$restore")" "$(git hash-object "$ready")"
            git diff --numstat
            git diff -- "$model"
          } >"$proof"
