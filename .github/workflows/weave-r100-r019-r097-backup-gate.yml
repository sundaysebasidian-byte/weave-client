name: Weave R019-R097 isolated backup acceptance
"on":
  push:
    branches: [dot/weave-android-r100-runner-preflight]
    paths: ['.github/workflows/weave-r100-r019-r097-backup-gate.yml']
permissions:
  contents: read
concurrency:
  group: weave-r019-r097-backup-acceptance
  cancel-in-progress: false
jobs:
  backup-acceptance:
    runs-on: macos-15-intel
    timeout-minutes: 85
    steps:
      - name: Check out historical proof floor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          persist-credentials: false
      - name: Build and run both isolated controls on one hosted image
        shell: bash
        run: |
          set -eEuo pipefail
          phase=hosted-runner
          fail() { printf '::error::Backup gate preflight (%s): %s\n' "$phase" "$1" >&2; exit 1; }
          trap 'printf "::error::Backup gate failed in %s at script line %s\n" "$phase" "$LINENO" >&2' ERR
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]] || fail 'Expected GitHub-hosted Actions, not a self-hosted or personal device'
          phase=intel-macos
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]] || fail 'Expected Darwin x86_64 on macos-15-intel'
          phase=runner-temp
          [[ -d ${RUNNER_TEMP:-} && -w $RUNNER_TEMP ]] || fail 'RUNNER_TEMP missing or not writable'
          out="$RUNNER_TEMP/weave-r019-r097-receipts"
          work="$(mktemp -d "$RUNNER_TEMP/weave-backup-lanes.XXXXXX")"
          helpers="$work/helpers"
          mkdir -p "$helpers" "$out/positive" "$out/negative"
          check_stage() { phase=$1; printf 'Preflight guard: %s\n' "$phase" | tee -a "$out/preflight-stages.txt"; }
          check_stage pinned-source
          floor=70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          [[ "$(git rev-parse HEAD)" == "$floor" ]] || fail 'Historical checkout SHA does not match'
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$source_status" ]] || fail 'Historical checkout is not pristine'
          check_stage fixture-unpacking
