          #!/usr/bin/env bash
          set -euo pipefail
          mode=${1:?positive or negative}
          patch=${2:?fixture path}
          proof=${3:?source proof file}
          floor=70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          folder=app/src/main/java/io/weave/client/ui
          model=$folder/AppViewModel.kt
          restore=$folder/BackupRestoreUi.kt
          test_source=app/src/androidTest/java/io/weave/client/ui/BackupStateOwnershipIntegrationTest.kt
          ready=tools/wait-android-ready.py
          fixture_sha=daef6f4450578c388e9ea19562f1edb475c76874df65a3f958bae486a911e2d6
          [[ "$mode" == positive || "$mode" == negative ]]
          [[ "$(git rev-parse HEAD)" == "$floor" ]]
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$source_status" ]]
          [[ "$(shasum -a 256 "$patch" | awk '{print $1}')" == "$fixture_sha" ]]
          [[ "$(git hash-object "$test_source")" == a262a792aa7e84c7c33ecbbe89f8472f1d6a8c9d ]]
          [[ "$(git hash-object "$model")" == b551c14ec25b57f45df2b9721302617ec7e1a2a9 ]]
          [[ "$(git hash-object "$restore")" == 60a0041fec79135331bfc763c49e984b06a5fec0 ]]
          [[ "$(git hash-object "$ready")" == 3b1a7e3178bdaa3da7ba0a9d7101ee155c092ba8 ]]
          git apply --check "$patch"
          git apply "$patch"
          [[ "$(git hash-object "$test_source")" == 4ffedfd5b9bd45a508c69071f4f6d80ef8ee5f59 ]]

          if [[ "$mode" == negative ]]; then
            python3 - "$model" <<'MUTATE_PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          before = path.read_bytes()
          guard = b"        if (mutableBackupState.value.running) return\n"
          target = (
              b"    fun discardBackupState() {\n"
              b"        // The Activity can be recreated while this ViewModel still owns active backup work.\n"
              + guard + b"        backupGeneration++\n"
          )
          if before.count(target) != 1:
              raise SystemExit("Expected one exact historical R019 guard")
          path.write_bytes(before.replace(target, target.replace(guard, b""), 1))
          MUTATE_PY
            [[ "$(git diff --numstat -- "$model")" == "$(printf '0\t1\t%s' "$model")" ]]
            [[ "$(git hash-object "$model")" == 2be7d7bf385dbaa011a3e6b6a17015001e8303ca ]]
            [[ "$(git diff --name-only)" == "$(printf '%s\n%s' "$test_source" "$model")" ]]
          else
            [[ "$(git diff --name-only)" == "$test_source" ]]
          fi
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          git diff --check
          {
            printf 'source_floor=%s\nfixture_sha256=%s\nworkflow_sha=%s\nmode=%s\n' "$floor" "$fixture_sha" "${GITHUB_SHA:?}" "$mode"
            printf 'test_blob=%s\nmodel_blob=%s\nrestore_blob=%s\nreadiness_blob=%s\n' \
              "$(git hash-object "$test_source")" "$(git hash-object "$model")" \
              "$(git hash-object "$restore")" "$(git hash-object "$ready")"
            git diff --numstat
            git diff -- "$model"
          } >"$proof"
          WEAVE_SOURCE
          cat >"$helpers/verify-receipt.py" <<'WEAVE_RECEIPT'
          """Check the single exact method on both Android raw JUnit outcomes."""
          from pathlib import Path
          import json
          import re
          import sys


          def require(condition, reason):
              if not condition:
                  raise SystemExit("Invalid backup gate receipt: " + reason)


          mode, path, destination = sys.argv[1:]
          require(mode in {"positive", "negative"}, "unrecognized mode")
          clazz = "io.weave.client.ui.BackupStateOwnershipIntegrationTest"
          method = "settingsReentryPreservesTheOwnerAndACommittedRestoreRefreshesOnce"
          body = Path(path).read_text(encoding="utf-8")
          require(not re.search(r"INSTRUMENTATION_(?:FAILED|ABORTED)|Process crashed|shortMsg=", body, re.I),
                  "runner crashed, aborted or failed before completing")
          lines = body.splitlines()
          status_prefix = "INSTRUMENTATION_STATUS: "
          result_prefix = "INSTRUMENTATION_RESULT: "
          code_prefix = "INSTRUMENTATION_STATUS_CODE: "
          final_code = "INSTRUMENTATION_CODE: -1"
          statuses, fields, result_fields = [], {}, {}
          section = "status"
          for line in lines:
              if line.startswith(status_prefix):
                  require(section == "status", "method fields after final result")
                  key, eq, value = line[len(status_prefix):].partition("=")
                  require(bool(key and eq) and key not in fields, "malformed or duplicate method field")
                  fields[key] = value
              elif line.startswith(code_prefix):
                  require(section == "status" and bool(fields), "status code without corresponding method")
                  statuses.append((line[len(code_prefix):], fields))
                  fields = {}
              elif line.startswith(result_prefix):
                  require(not fields and section in {"status", "result"}, "unexpected final result transition")
                  section = "result"
                  key, eq, value = line[len(result_prefix):].partition("=")
                  require(bool(key and eq) and key not in result_fields, "malformed or duplicate final result field")
                  result_fields[key] = value
              elif line.startswith("INSTRUMENTATION_CODE:"):
                  require(section == "result" and line == final_code, "missing, duplicate or unexpected final code")
                  section = "done"
              elif section == "done":
                  require(not line.strip(), "non-empty trailing material after final code")
          require(section == "done" and "stream" in result_fields, "missing terminal result bundle")
          terminal = "0" if mode == "positive" else "-2"
          require([code for code, _ in statuses] == ["1", terminal], "unexpected number/outcome of method records")
          for _, record in statuses:
              require(all(record.get(key) == value for key, value in {
                  "id": "AndroidJUnitRunner", "class": clazz, "test": method, "current": "1", "numtests": "1",
              }.items()), "runner, method, or test count differs")
          require("stack" not in statuses[0][1], "unexpected failure in the method start bundle")
          summary = body.split("INSTRUMENTATION_RESULT: stream=", 1)[1]
          if mode == "positive":
              require("stack" not in statuses[1][1] and summary.splitlines().count("OK (1 test)") == 1
                      and "FAILURES!!!" not in summary, "expected a clean single-method pass")
              outcome = "single-test-pass"
          else:
              failure = statuses[1][1].get("stack", "")
              error = re.fullmatch(
                  r"java\.lang\.AssertionError: one post-commit refresh publication expected:<([0-9]+)> but was:<([0-9]+)>",
                  failure,
              )
              require(error and int(error[1]) == int(error[2]) + 1, "wrong assertion or refresh delta")
              require(re.search(rf"(?m)^\s*at {re.escape(clazz)}\.{method}\(BackupStateOwnershipIntegrationTest\.kt:\d+\)$", body),
                      "assertion is not anchored to the exact device-test method")
              require(re.search(r"(?m)^Tests run:\s*1,\s*Failures:\s*1\s*$", summary)
                      and summary.splitlines().count("FAILURES!!!") == 1 and "OK (" not in summary,
                      "expected one JUnit assertion failure")
              require("restore must have committed its synthetic palette" not in body,
                      "the durable commit was not demonstrated")
              outcome = "durable-commit-with-missing-refresh"
          Path(destination).write_text(json.dumps({
              "mode": mode, "class": clazz, "method": method, "status_codes": [1, int(terminal)],
              "final_code": -1, "result": outcome,
          }, indent=2) + "\n")
          print(f"{mode}: {outcome}")
          WEAVE_RECEIPT
          cat >"$helpers/run-device.sh" <<'WEAVE_DEVICE'
          #!/usr/bin/env bash
          set -eEuo pipefail
          mode=${1:?positive or negative}
          out=${2:?receipt directory}
          tools=${3:?generated helper directory}
          [[ "$mode" == positive || "$mode" == negative ]]
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]]
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == x86_64 ]]
          pid=''
          adb_started=0
          stage=setup
          trap 'printf "::error::Backup gate %s failed in %s at line %s\n" "$mode" "$stage" "$LINENO" >&2' ERR
          bounded() {
            python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:],timeout=int(sys.argv[1])).returncode)' "$@"
          }
          sdk=${ANDROID_HOME:?}
          adb="$sdk/platform-tools/adb"
          emulator="$sdk/emulator/emulator"
          aapt="$sdk/build-tools/37.0.0/aapt2"
          image='system-images;android-36;google_apis;x86_64'
          serial=emulator-5554
          export WEAVE_ISOLATED_EMULATOR=1 WEAVE_TEST_ADB_PORT=5037 WEAVE_TEST_BOOT_TIMEOUT=900
          export ANDROID_ADB_SERVER_PORT=$WEAVE_TEST_ADB_PORT ADB_MDNS_AUTO_CONNECT=''
          private="$(mktemp -d "${RUNNER_TEMP:?}/weave-backup-$mode.XXXXXX")"
          export ANDROID_USER_HOME="$private/user" ANDROID_EMULATOR_HOME="$private/emulator" ANDROID_AVD_HOME="$private/avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME"

          run_adb() { bounded 45 "$adb" -P "$WEAVE_TEST_ADB_PORT" "$@"; }
          guest() { run_adb -s "$serial" shell "$@" | tr -d '\r'; }
          cleanup() {
            result=$?
            trap - EXIT ERR
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || :
              for ((attempt = 0; attempt < 20; attempt++)); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || :
                result=1
              else
                wait "$pid" 2>/dev/null || :
              fi
            fi
            if [[ "$adb_started" == 1 ]]; then
              bounded 10 "$adb" -P "$WEAVE_TEST_ADB_PORT" kill-server || result=1
            fi
            printf 'stage=%s\nexit=%s\n' "$stage" "$result" >"$out/exit.txt"
            exit "$result"
          }
          trap cleanup EXIT

          # No connection to, installation on, or destruction of an existing device/profile.
          python3 - "$WEAVE_TEST_ADB_PORT" <<'ENSURE_PORT_PY'
          import socket
          import sys

          for port in (int(sys.argv[1]), 5554, 5555):
              with socket.socket() as sock:
                  sock.settimeout(1)
                  if sock.connect_ex(("127.0.0.1", port)) == 0:
                      raise SystemExit(f"Refusing to reuse occupied emulator or ADB port {port}")
          ENSURE_PORT_PY
          # Retain the operator's known-good Intel port, graphics, image, memory and boot flags.
          run_adb start-server
          adb_started=1
          initial_devices="$(run_adb devices)"
          [[ "$(awk 'NR > 1 && NF {print}' <<<"$initial_devices")" == "" ]]
          printf 'no\n' | bounded 60 "${WEAVE_AVDMANAGER:?}" create avd -n weave_gate -k "$image"
          stage=boot
          "$emulator" -avd weave_gate -port 5554 -no-window -no-boot-anim -no-audio -no-snapshot -accel on -gpu swiftshader -memory 2048 -show-kernel >"$out/emulator.log" 2>&1 &
          pid=$!
          export WEAVE_TEST_EMULATOR_PID="$pid"
          bounded 900 python3 -u tools/wait-android-ready.py "$serial" | tee "$out/readiness.txt"
          [[ "$(run_adb devices | awk 'NR > 1 && NF {print $1 " " $2}')" == "$serial device" ]]
          [[ "$(guest getprop ro.kernel.qemu)" == 1 && "$(guest getprop ro.product.cpu.abi)" == x86_64 ]]
          [[ "$(guest getprop ro.build.version.sdk)" == 36 && "$(guest am get-current-user)" == 0 ]]
          fingerprint="$(guest getprop ro.build.fingerprint)"
          [[ -n "$fingerprint" ]]
          printf '%s\n' "$fingerprint" >"$out/guest-fingerprint.txt"
          printf '%s\n' "$serial" "$image" "$WEAVE_TEST_BOOT_TIMEOUT" >"$out/guest-configuration.txt"
          if [[ "$mode" == negative ]]; then
            cmp "$out/../positive/guest-fingerprint.txt" "$out/guest-fingerprint.txt"
            cmp "$out/../positive/guest-configuration.txt" "$out/guest-configuration.txt"
          fi

          stage=preinstall
          app=app/build/outputs/apk/debug/app-x86_64-debug.apk
          tests=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          [[ -s "$app" && -s "$tests" ]]
          app_id=io.weave.client.acceptance
          test_id=io.weave.client.acceptance.test
          package_id() { "$aapt" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p"; }
          [[ "$(package_id "$app")" == "$app_id" && "$(package_id "$tests")" == "$test_id" ]]
          existing_weave="$(guest pm list packages io.weave.client)"
          [[ -z "$existing_weave" ]]
          shasum -a 256 "$app" "$tests" >"$out/apk-sha256.txt"

          # The R001 v2 run hit the old 45-second generic command limit before the
          # first install returned. Bound each install separately; never retry it.
          install_and_verify() {
            local role=$1 apk=$2 expected_id=$3
            stage="install-$role"
            printf 'Installing %s on %s (240-second limit)\n' "$expected_id" "$serial"
            if ! bounded 240 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" install --user 0 "$apk" \
              2>&1 | tr -d '\r' | tee "$out/install-$role.txt"; then
              printf '::error::Install of %s failed or timed out\n' "$expected_id" >&2
              return 1
            fi
            if ! awk '$0 == "Success" { successes++ } /(^|[[:space:]])Failure([[:space:]]|$)/ { failed = 1 } END { exit !(successes == 1 && !failed) }' "$out/install-$role.txt"; then
              printf '::error::Install of %s did not report one clean Success\n' "$expected_id" >&2
              return 1
            fi
            stage="pm-path-$role"
            if ! guest pm path --user 0 "$expected_id" | tee "$out/pm-path-$role.txt"; then
              printf '::error::Package manager could not read back %s for user 0\n' "$expected_id" >&2
              return 1
            fi
            if ! awk '/^package:\/data\/app\/[^[:space:]]+\/base\.apk$/ { bases++ } END { exit !(NR == 1 && bases == 1) }' "$out/pm-path-$role.txt"; then
              printf '::error::Package manager did not report the installed base APK for %s\n' "$expected_id" >&2
              return 1
            fi
          }
          install_and_verify app "$app" "$app_id"
          install_and_verify test "$tests" "$test_id"
          stage=instrumentation-runner
          runner="$test_id/androidx.test.runner.AndroidJUnitRunner"
          guest pm list instrumentation "$app_id" | grep -Fx "instrumentation:$runner (target=$app_id)" >"$out/runner.txt"
          stage=dex-compile
          bounded 120 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell cmd package compile -m verify -f "$app_id"
          bounded 120 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell cmd package compile -m verify -f "$test_id"

          stage=instrumentation
          test_target='io.weave.client.ui.BackupStateOwnershipIntegrationTest#settingsReentryPreservesTheOwnerAndACommittedRestoreRefreshesOnce'
          printf '%s\n' "$test_target" 'weaveIsolatedEmulator=1' 'weaveFreshBackupProfile=1' >"$out/test-selection.txt"
          bounded 240 "$adb" -P "$WEAVE_TEST_ADB_PORT" -s "$serial" shell am instrument --user 0 -w -r \
            -e class "$test_target" -e weaveIsolatedEmulator 1 -e weaveFreshBackupProfile 1 "$runner" \
            2>"$out/adb-stderr.txt" | tr -d '\r' | tee "$out/instrumentation.txt"
          python3 "$tools/verify-receipt.py" "$mode" "$out/instrumentation.txt" "$out/verified.json"
          stage=verified
          WEAVE_DEVICE
          check_stage java-17
          JAVA_HOME="$(/usr/libexec/java_home -v 17)" || fail 'java_home could not resolve Java 17'
          [[ -x "$JAVA_HOME/bin/java" ]] || fail 'Resolved Java 17 has no executable java'
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          java_version="$("$JAVA_HOME/bin/java" -version 2>&1)" || fail 'Resolved Java failed to start'
          grep -Eq 'version "17([."]|$)' <<<"$java_version" || fail 'Resolved Java is not major version 17'

          check_stage sdk-root
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$ANDROID_HOME" && -d "$ANDROID_HOME" && -w "$ANDROID_HOME" ]] || fail 'ANDROID_HOME missing, invalid, or not writable'
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdk="$ANDROID_HOME"
          check_stage sdk-manager-and-avd-manager
          sdkmanager=''
          shopt -s nullglob
          for bin in "$sdk"/cmdline-tools/latest/bin "$sdk"/cmdline-tools/*/bin "$sdk"/tools/bin; do
            if [[ -x "$bin/sdkmanager" && -x "$bin/avdmanager" ]]; then
              sdkmanager="$bin/sdkmanager"
              export WEAVE_AVDMANAGER="$bin/avdmanager"
              break
            fi
          done
          [[ -n "$sdkmanager" ]] || fail 'No stock executable sdkmanager and avdmanager pair'
          {
            printf 'workflow=%s\nsource_floor=%s\nrun=%s\nrun_attempt=%s\nrunner_image=%s\nrunner_image_version=%s\nsdkmanager=%s\n' \
              "$GITHUB_SHA" "$floor" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$sdkmanager"
            sw_vers
            printf '%s\n' "$java_version"
          } 2>&1 | tee "$out/host-sdk.txt"
          check_stage sdk-package-provisioning
          if ! python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:],timeout=int(sys.argv[1])).returncode)' \
            600 "$sdkmanager" 'platform-tools' 'build-tools;37.0.0' 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.31.6' 'system-images;android-36;google_apis;x86_64' \
            2>&1 | tee -a "$out/host-sdk.txt"; then
            fail 'SDK package install failed or timed out; inspect host-sdk.txt for repositories, licensing or Darwin package availability'
          fi

          check_stage sdk-adb
          [[ -x "$sdk/platform-tools/adb" ]] || fail 'Missing stock executable platform-tools adb'
          "$sdk/platform-tools/adb" version | tee -a "$out/host-sdk.txt"
          check_stage sdk-build-tools-37
          [[ -x "$sdk/build-tools/37.0.0/aapt2" ]] || fail 'Missing build-tools 37.0.0 aapt2 (do not substitute aapt)'
          "$sdk/build-tools/37.0.0/aapt2" version | tee -a "$out/host-sdk.txt"
          check_stage sdk-platform-37
          [[ -s "$sdk/platforms/android-37.0/android.jar" ]] || fail 'Missing Android 37.0 platform android.jar'
          check_stage sdk-ndk-29
          [[ -s "$sdk/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" ]] || fail 'Missing NDK 29.0.14206865 toolchain'
          check_stage sdk-cmake-3.31.6
          [[ -x "$sdk/cmake/3.31.6/bin/cmake" ]] || fail 'Missing executable CMake 3.31.6'
          check_stage stock-emulator
          [[ -x "$sdk/emulator/emulator" && -s "$sdk/emulator/source.properties" ]] || fail 'Missing stock emulator or package revision'
          "$sdk/emulator/emulator" -version 2>&1 | tee -a "$out/host-sdk.txt"
          check_stage android-36-google-apis-x86_64-image
          image_dir="$sdk/system-images/android-36/google_apis/x86_64"
          [[ -s "$image_dir/source.properties" && -s "$image_dir/system.img" ]] || fail 'Missing Android 36 Google APIs x86_64 image or package revision'
          cat "$image_dir/source.properties" | tee -a "$out/host-sdk.txt"
          check_stage intel-hardware-hypervisor
          hv="$(/usr/sbin/sysctl -n kern.hv_support)" || fail 'Could not read kern.hv_support'
          [[ "$hv" == 1 ]] || fail 'Host reports no hardware virtualization'
          check_stage emulator-hypervisor-framework
          if ! "$sdk/emulator/emulator" -accel-check 2>&1 | tee "$out/acceleration.txt"; then
            fail 'Emulator acceleration probe failed'
          fi
          grep -q 'Hypervisor.Framework' "$out/acceleration.txt" || fail 'Probe did not report Hypervisor.Framework'
          check_stage fingerprint-sdk
          shasum -a 256 "$sdk/emulator/emulator" "$sdk/platform-tools/adb" "$sdk/build-tools/37.0.0/aapt2" \
            "$sdk/emulator/source.properties" "$image_dir/source.properties" >"$out/sdk-sha256.txt"
          check_stage preflight-verified
          echo 'All pre-build guards passed; no emulator has been launched.'

          for mode in positive negative; do
            phase="$mode-source-preparation"
            src="$work/$mode"
            git worktree add --detach "$src" "$floor"
            (
              cd "$src"
              bash "$helpers/prepare-source.sh" "$mode" "$helpers/backup-race-fixture.patch" "$out/$mode/source-proof.txt"
              phase="$mode-gradle-assemble"
              ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PweaveDeviceTest=true --no-daemon --no-configuration-cache \
                2>&1 | tee "$out/$mode/gradle.log"
              phase="$mode-device"
              bash "$helpers/run-device.sh" "$mode" "$out/$mode" "$helpers"
            )
            phase="$mode-sdk-identity"
            shasum -a 256 -c "$out/sdk-sha256.txt"
          done
          [[ -s "$out/positive/verified.json" && -s "$out/negative/verified.json" ]]
          printf 'Both controls verified on the same hosted runner and matching guest fingerprints.\n' | tee "$out/pair-verified.txt"
      - name: Retain receipt and diagnostics only, never APKs or AVD data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weave-r019-r097-receipts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-r019-r097-receipts/
          if-no-files-found: error
          retention-days: 14
