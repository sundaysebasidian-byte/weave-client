name: Weave Android round 057 compile only

on:
  push:
    branches: [dot/weave-android-round001]
    paths:
      - '.github/workflows/weave-round057-compile.yml'

permissions:
  contents: read

jobs:
  instrumentation-compile:
    name: Compile subscription instrumentation without a device
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install the project's locked Android toolchain
        run: sdkmanager "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android instrumentation sources
        run: ./gradlew -PweaveDeviceTest=true :app:compileDebugAndroidTestKotlin --console=plain --no-build-cache --no-daemon --no-configuration-cache
      - name: Publish a compile-only receipt
        run: printf 'Android instrumentation compile only · %s · no device was started\n' "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
