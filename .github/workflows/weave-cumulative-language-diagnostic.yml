name: Weave cumulative language diagnostic

on:
  push:
    branches: [dot/weave-android-round001]
    paths:
      - '.github/workflows/weave-cumulative-language-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    name: Language coverage exact failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install the project's locked Android toolchain
        run: sdkmanager "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run exact coverage assertion with diagnostic detail
        run: ./gradlew :app:testDebugUnitTest --tests io.weave.client.ui.CompleteLanguageCoverageTest --info --no-build-cache --no-daemon --no-configuration-cache
      - name: Report exact coverage assertion without any user data
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("app/build/test-results/testDebugUnitTest/TEST-io.weave.client.ui.CompleteLanguageCoverageTest.xml")
          if not path.is_file():
              raise SystemExit("Expected static-language coverage XML unavailable")
          root = ET.parse(path).getroot()
          for case in root.findall("testcase"):
              for problem in case.findall("failure") + case.findall("error"):
                  print(json.dumps({"commit": os.environ["GITHUB_SHA"], "case": case.get("name"), "message": problem.get("message")}, ensure_ascii=False))
          print(json.dumps({"commit": os.environ["GITHUB_SHA"], "tests": root.get("tests"), "failures": root.get("failures"), "errors": root.get("errors")}))
          PY
