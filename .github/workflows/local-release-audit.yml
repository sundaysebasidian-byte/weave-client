name: Local release audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ripgrep
      - name: Audit local-open-source distribution profile
        run: bash tools/audit-local-release.sh
