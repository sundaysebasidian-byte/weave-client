          check_stage sdk-build-tools-37
          [[ -x "$sdk/build-tools/37.0.0/aapt2" ]] || fail 'Missing build-tools 37.0.0 aapt2 (do not substitute aapt)'
          "$sdk/build-tools/37.0.0/aapt2" version | tee -a "$out/host-sdk.txt"
          check_stage sdk-platform-37
          [[ -s "$sdk/platforms/android-37.0/android.jar" ]] || fail 'Missing Android 37.0 platform android.jar'
          check_stage sdk-ndk-29
          [[ -s "$sdk/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" ]] || fail 'Missing NDK 29.0.14206865 toolchain'
          check_stage sdk-cmake-3.31.6
          [[ -x "$sdk/cmake/3.31.6/bin/cmake" ]] || fail 'Missing executable CMake 3.31.6'
          check_stage stock-emulator
          [[ -x "$sdk/emulator/emulator" && -s "$sdk/emulator/source.properties" ]] || fail 'Missing stock emulator or package revision'
          "$sdk/emulator/emulator" -version 2>&1 | tee -a "$out/host-sdk.txt"
          check_stage android-36-google-apis-x86_64-image
          image_dir="$sdk/system-images/android-36/google_apis/x86_64"
          [[ -s "$image_dir/source.properties" && -s "$image_dir/system.img" ]] || fail 'Missing Android 36 Google APIs x86_64 image or package revision'
