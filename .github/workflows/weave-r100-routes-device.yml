          JAVA_HOME="$(/usr/libexec/java_home -v 17)" || fail 'java_home could not resolve Java 17'
          [[ -x "$JAVA_HOME/bin/java" ]] || fail 'Resolved Java 17 has no executable java'
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          java_version="$("$JAVA_HOME/bin/java" -version 2>&1)" || fail 'Resolved Java failed to start'
          grep -Eq 'version "17([."]|$)' <<<"$java_version" || fail 'Resolved Java is not major version 17'

