          RsWMBrKHmuxEKSdIF4XqUj0QCGmM/OqVig54fA4dVtVRRorx8RQWdqFABJ/QbQN4oKMw6CPvEkpA
          KseBBaqDl/qhSt91SkJcl0FAI4WFh6rpNhwkb3jqx3Vpmy7HbjIyWPnSCqpp8q51/s4qk1m97YCp
          y8s6NkYVy3M6Xi2XkCoWoora/fGAFCyKbqw6TPoY7CzETppMOVkhdjFpwTD88DdWs4gGdVUlyP2L
          XFKsMfo6A1SePHmSm0cCxeWni+fqAHYxMQiJn3V6XxjJHrkq2YUOAMoOU59ix1xwXb8nIUrPJpRE
          RT/WfiyVmPR0AMrHTP7DZ4I6WKU2RKXcotDGh+ojHg24Lx3buPv/+6nhwKBuAAA=
          WIDGET_B64
          python3 - "$kit" <<'UNPACK_PY'
          import base64, gzip, hashlib, json, sys
          from pathlib import Path
          kit = Path(sys.argv[1])
          payload = b"".join((kit / "bundle.b64").read_bytes().splitlines())
          if hashlib.sha256(payload).hexdigest() != "bcff64e294fb99fbfe5f6f90ef8c1c0629168b3830e1f27a55c5591025d4f1ea":
              raise SystemExit("Packed Widget test kit checksum mismatch")
          files = json.loads(gzip.decompress(base64.b64decode(payload, validate=True)))
          if tuple(sorted(files)) != ('r100-widget-runtime-gate.patch', 'run-widget.sh', 'stage-widget.py', 'verify-receipt.py'):
              raise SystemExit("Unexpected Widget test kit path")
          for name, text in files.items():
              (kit / name).write_bytes(text.encode())
          UNPACK_PY
          check_stage java-17
          JAVA_HOME="$(/usr/libexec/java_home -v 17)" || fail 'java_home could not resolve Java 17'
          [[ -x "$JAVA_HOME/bin/java" ]] || fail 'Resolved Java 17 has no executable java'
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          java_version="$("$JAVA_HOME/bin/java" -version 2>&1)" || fail 'Resolved Java failed to start'
          grep -Eq 'version "17([."]|$)' <<<"$java_version" || fail 'Resolved Java is not major version 17'

          check_stage sdk-root
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$ANDROID_HOME" && -d "$ANDROID_HOME" && -w "$ANDROID_HOME" ]] || fail 'ANDROID_HOME missing, invalid, or not writable'
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdk="$ANDROID_HOME"
          check_stage sdk-manager-and-avd-manager
          sdkmanager=''
          shopt -s nullglob
          for bin in "$sdk"/cmdline-tools/latest/bin "$sdk"/cmdline-tools/*/bin "$sdk"/tools/bin; do
            if [[ -x "$bin/sdkmanager" && -x "$bin/avdmanager" ]]; then
              sdkmanager="$bin/sdkmanager"
              export WEAVE_AVDMANAGER="$bin/avdmanager"
              break
            fi
          done
          [[ -n "$sdkmanager" ]] || fail 'No stock executable sdkmanager and avdmanager pair'
          {
            printf 'workflow=%s\nsource_floor=%s\nrun=%s\nrun_attempt=%s\nrunner_image=%s\nrunner_image_version=%s\nsdkmanager=%s\n' \
              "$GITHUB_SHA" "$floor" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$sdkmanager"
            sw_vers
            printf '%s\n' "$java_version"
          } 2>&1 | tee "$out/host-sdk.txt"
          check_stage sdk-package-provisioning
          if ! python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[2:],timeout=int(sys.argv[1])).returncode)' \
            600 "$sdkmanager" 'platform-tools' 'build-tools;37.0.0' 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.31.6' 'system-images;android-36;google_apis;x86_64' \
            2>&1 | tee -a "$out/host-sdk.txt"; then
            fail 'SDK package install failed or timed out; inspect host-sdk.txt for repositories, licensing or Darwin package availability'
          fi

          check_stage sdk-adb
          [[ -x "$sdk/platform-tools/adb" ]] || fail 'Missing stock executable platform-tools adb'
          "$sdk/platform-tools/adb" version | tee -a "$out/host-sdk.txt"
          check_stage sdk-build-tools-37
          [[ -x "$sdk/build-tools/37.0.0/aapt2" ]] || fail 'Missing build-tools 37.0.0 aapt2 (do not substitute aapt)'
          "$sdk/build-tools/37.0.0/aapt2" version | tee -a "$out/host-sdk.txt"
          check_stage sdk-platform-37
          [[ -s "$sdk/platforms/android-37.0/android.jar" ]] || fail 'Missing Android 37.0 platform android.jar'
          check_stage sdk-ndk-29
          [[ -s "$sdk/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" ]] || fail 'Missing NDK 29.0.14206865 toolchain'
          check_stage sdk-cmake-3.31.6
          [[ -x "$sdk/cmake/3.31.6/bin/cmake" ]] || fail 'Missing executable CMake 3.31.6'
          check_stage stock-emulator
          [[ -x "$sdk/emulator/emulator" && -s "$sdk/emulator/source.properties" ]] || fail 'Missing stock emulator or package revision'
          "$sdk/emulator/emulator" -version 2>&1 | tee -a "$out/host-sdk.txt"
          check_stage android-36-google-apis-x86_64-image
          image_dir="$sdk/system-images/android-36/google_apis/x86_64"
          [[ -s "$image_dir/source.properties" && -s "$image_dir/system.img" ]] || fail 'Missing Android 36 Google APIs x86_64 image or package revision'
          cat "$image_dir/source.properties" | tee -a "$out/host-sdk.txt"
          check_stage intel-hardware-hypervisor
          hv="$(/usr/sbin/sysctl -n kern.hv_support)" || fail 'Could not read kern.hv_support'
          [[ "$hv" == 1 ]] || fail 'Host reports no hardware virtualization'
          check_stage emulator-hypervisor-framework
          if ! "$sdk/emulator/emulator" -accel-check 2>&1 | tee "$out/acceleration.txt"; then
            fail 'Emulator acceleration probe failed'
          fi
          grep -q 'Hypervisor.Framework' "$out/acceleration.txt" || fail 'Probe did not report Hypervisor.Framework'
          check_stage fingerprint-sdk
          shasum -a 256 "$sdk/emulator/emulator" "$sdk/platform-tools/adb" "$sdk/build-tools/37.0.0/aapt2" \
            "$sdk/emulator/source.properties" "$image_dir/source.properties" >"$out/sdk-sha256.txt"
          check_stage preflight-verified
          echo 'All Intel/SDK guards passed; no emulator has been launched.'

          check_stage exact-widget-source
          python3 "$kit/stage-widget.py" ../fixture/tools/acceptance/r100-appearance-delta.json.gz.b64 "$PWD" "$out/source-proof.json"
          check_stage diagnostic-apk-build
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PweaveDeviceTest=true --no-daemon --no-configuration-cache 2>&1 | tee "$out/gradle.log"
          shasum -a 256 -c "$out/sdk-sha256.txt"
          check_stage disposable-widget-device
          bash "$kit/run-widget.sh" "$out" "$kit"
      - name: Retain widget diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weave-r100-widget-receipts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weave-r100-widget-receipts/
          if-no-files-found: error
          retention-days: 14
