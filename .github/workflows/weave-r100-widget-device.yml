name: Weave R100 Android widget diagnostics (Ubuntu KVM)
"on":
  push:
    branches: [dot/weave-android-r100-runner-preflight]
    paths: ['.github/workflows/weave-r100-widget-device.yml']
permissions:
  contents: read
concurrency:
  group: weave-r100-widget-device
  cancel-in-progress: false
jobs:
  widget-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Retrieve the exact compile-proven 43-path overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6b6d9a49826446ac30b8875f1316235564de0122
          path: fixture
          persist-credentials: false
      - name: Retrieve the exact historical source floor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          path: source
          persist-credentials: false
      - name: Build the exact overlay and run two isolated widget tests
        shell: bash
        working-directory: source
        run: |
          set -eEuo pipefail
          phase=hosted-runner
          fail() { printf '::error::Widget gate preflight (%s): %s\n' "$phase" "$1" >&2; exit 1; }
          trap 'printf "::error::Widget gate failed in %s at script line %s\n" "$phase" "$LINENO" >&2' ERR
          [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]] || fail 'Expected GitHub-hosted Actions'
          phase=ubuntu-standard
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 && ${RUNNER_OS:-} == Linux ]] || fail 'Expected Linux x86_64'
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 ]] || fail 'Expected the stock Ubuntu 24.04 runner'
          phase=runner-temp
          [[ -d ${RUNNER_TEMP:-} && -w $RUNNER_TEMP ]] || fail 'RUNNER_TEMP missing or not writable'
          out="$RUNNER_TEMP/weave-r100-widget-receipts"
          kit="$(mktemp -d "$RUNNER_TEMP/weave-widget-kit.XXXXXX")"
          mkdir "$out"
          check_stage() { phase=$1; printf 'Preflight guard: %s\n' "$phase" | tee -a "$out/preflight-stages.txt"; }
          check_stage kvm-access
          {
            id
            if [[ -e /dev/kvm ]]; then stat -c '%F %a %U %G %n' /dev/kvm; else echo '/dev/kvm is absent'; fi
          } 2>&1 | tee "$out/kvm-access.txt"
          [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]] || fail 'KVM unavailable without permission changes; stop before SDK provisioning or APK build'
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$ANDROID_HOME" && -d "$ANDROID_HOME" ]] || fail 'Stock Android SDK root unavailable'
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          check_stage stock-emulator-kvm-usable
          [[ -x "$ANDROID_HOME/emulator/emulator" ]] || fail 'Stock emulator unavailable; stop before APK build'
          if ! python3 -c 'import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:],timeout=20).returncode)' \
            "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee "$out/acceleration.txt"; then
            fail 'Stock emulator KVM check failed or timed out; stop before APK build'
          fi
          grep -Eq '^[[:space:]]*KVM \(version [0-9]+\) is installed and usable\.[[:space:]]*$' "$out/acceleration.txt" || fail 'No usable KVM receipt; stop before APK build'
          sha256sum "$ANDROID_HOME/emulator/emulator" >"$out/preflight-emulator-sha256.txt"
          check_stage pinned-source
          floor=70524a8dafafa4cd9037ca4c17b40ac6a44ca662
          fixture_commit=6b6d9a49826446ac30b8875f1316235564de0122
          [[ "$(git rev-parse HEAD)" == "$floor" ]] || fail 'Historical checkout SHA does not match'
          [[ "$(git -C ../fixture rev-parse HEAD)" == "$fixture_commit" ]] || fail 'Compiled delta checkout SHA does not match'
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          [[ -z "$source_status" ]] || fail 'Historical checkout is not pristine'
          check_stage fixture-unpacking
          cat >"$kit/bundle.b64" <<'WIDGET_B64'
