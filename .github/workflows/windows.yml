name: Windows integrity

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Windows core tests
        run: dotnet test windows/src/Weave.Windows.Core/Weave.Windows.Core.Tests/Weave.Windows.Core.Tests.csproj -c Release --nologo
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: WinUI x64 build
        run: msbuild windows/src/Weave.Windows/Weave.Windows.csproj /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
