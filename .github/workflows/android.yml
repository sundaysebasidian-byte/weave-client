name: Android integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Legacy SDK "tools" is no longer available; the action installs cmdline-tools itself.
          packages: platform-tools
          cmdline-tools-version: '15859902'
      - name: Install locked Android toolchain
        run: sdkmanager "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache
      - name: Android lint
        timeout-minutes: 25
        run: ./gradlew lintDebug --no-daemon --no-configuration-cache
      - name: Debug build
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --no-configuration-cache
      - name: Storage transactions on a disposable Android emulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-36;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/weave-android-user"
          export ANDROID_EMULATOR_HOME="$RUNNER_TEMP/weave-android-emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/weave-avds"
          export ANDROID_ADB_SERVER_PORT=5041
          export ADB_MDNS_AUTO_CONNECT=''
          export WEAVE_TEST_ADB_PORT=5041
          export WEAVE_ISOLATED_EMULATOR=1
          export WEAVE_TEST_RESULTS="$RUNNER_TEMP/weave-storage-results"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME" "$ANDROID_AVD_HOME" "$WEAVE_TEST_RESULTS"
          printf 'no\n' | avdmanager create avd -n weave-storage -k 'system-images;android-36;google_apis;x86_64'
          adb -P 5041 --one-device weave-isolated-no-usb start-server
          emulator_pid=''
          cleanup() {
            result=$?
            if [[ $result != 0 ]]; then tail -80 "$WEAVE_TEST_RESULTS/emulator.log" || true; fi
            adb -P 5041 -s emulator-5580 emu kill >/dev/null 2>&1 || true
            if [[ -n "$emulator_pid" ]]; then
              kill "$emulator_pid" 2>/dev/null || true
              wait "$emulator_pid" 2>/dev/null || true
            fi
            adb -P 5041 kill-server || true
          }
          trap cleanup EXIT
          # Use only permissions already available to the runner; software emulation needs no KVM access.
          acceleration=off
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then acceleration=on; fi
          echo "Emulator acceleration: $acceleration"
          "$ANDROID_HOME/emulator/emulator" -avd weave-storage -port 5580 -accel "$acceleration" \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader -cores 2 -memory 2048 -camera-back none -camera-front none \
            > "$WEAVE_TEST_RESULTS/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 300); do
            kill -0 "$emulator_pid"
            if [[ $(timeout 5 adb -P 5041 -s emulator-5580 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true) == 1 ]]; then break; fi
            sleep 3
          done
          bash tools/test-android-storage.sh emulator-5580
      - name: Preserve device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weave-Android-storage-tests
          path: ${{ runner.temp }}/weave-storage-results/
          if-no-files-found: warn
      - name: Release build (ABI splits)
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache
      - name: Ensure no universal APK is published
        run: test -z "$(find app/build/outputs/apk -iname '*universal*.apk' -print -quit)"
      - name: Verify bundled core hashes
        run: |
          test "$(sha256sum app/src/main/jniLibs/arm64-v8a/libclash.so | cut -d' ' -f1)" = "$(sed -n 's/^libclash.arm64-v8a.sha256=//p' core-lock.properties)"
          test "$(sha256sum app/src/main/jniLibs/armeabi-v7a/libclash.so | cut -d' ' -f1)" = "$(sed -n 's/^libclash.armeabi-v7a.sha256=//p' core-lock.properties)"
          test "$(sha256sum app/src/main/jniLibs/x86/libclash.so | cut -d' ' -f1)" = "$(sed -n 's/^libclash.x86.sha256=//p' core-lock.properties)"
          test "$(sha256sum app/src/main/jniLibs/x86_64/libclash.so | cut -d' ' -f1)" = "$(sed -n 's/^libclash.x86_64.sha256=//p' core-lock.properties)"
