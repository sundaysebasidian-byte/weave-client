name: Bug report
description: Report a reproducible, non-security problem using redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach live subscriptions, credentials, QR codes, or exploit details. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Weave version
      placeholder: 0.3.0-alpha25
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: Pixel 8, Android 17
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal redacted configuration if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed subscription tokens, node credentials, QR codes, IP addresses, and private logs.
          required: true
